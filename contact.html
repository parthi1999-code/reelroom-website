<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audioheads — Contact us</title>
<meta name="description" content="Audioheads: live show production, A/V rental and integration, an authorised Pioneer DJ service centre and artist management in Bengaluru since 2008.">
<meta name="theme-color" content="#0B0709">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' fill='%230B0709'/%3E%3Crect x='2' y='2' width='18' height='18' fill='none' stroke='%23C2525E' stroke-width='2'/%3E%3Ccircle cx='11' cy='13' r='4.5' fill='%23C2525E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Tektur:wght@600;800&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0709}
a{color:#F4E4E6}a:hover{color:#FFFFFF}
.ah-chamfer-l{clip-path:polygon(12px 0,100% 0,100% 100%,0 100%,0 12px)}
.ah-chamfer-r{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.ah-chamfer-cta{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.ah-card{clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.ah-field{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);background:rgba(32,16,21,.82);backdrop-filter:blur(8px);display:grid;grid-template-columns:150px 1fr;align-items:center;min-height:58px;box-sizing:border-box;transition:background .25s}
.ah-field:focus-within{background:rgba(64,26,35,.9)}
.ah-field>span{padding:0 18px;font:700 10px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#A8939A}
.ah-field input,.ah-field select,.ah-field textarea{background:transparent;border:none;outline:none;color:#F4E4E6;font:500 15px 'Schibsted Grotesk',system-ui,sans-serif;padding:18px 18px 18px 0;width:100%;box-sizing:border-box;appearance:none;-webkit-appearance:none}
.ah-dd-btn{background:transparent;border:none;outline:none;color:#F4E4E6;font:500 15px 'Schibsted Grotesk',system-ui,sans-serif;padding:18px 18px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;cursor:pointer;text-align:left;min-height:58px;box-sizing:border-box}
.ah-dd{list-style:none;margin:0;padding:6px;position:absolute;left:0;right:0;top:calc(100% + 6px);background:rgba(24,12,16,.97);backdrop-filter:blur(12px);border:1px solid rgba(230,170,178,.18);clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);box-shadow:0 24px 60px rgba(0,0,0,.5);max-height:320px;overflow-y:auto;box-sizing:border-box}
.ah-dd-opt{width:100%;display:flex;align-items:center;gap:14px;background:transparent;border:none;cursor:pointer;text-align:left;padding:0 14px;min-height:44px;font:500 14px 'Schibsted Grotesk',system-ui,sans-serif;transition:background .15s,color .15s}
.ah-dd-opt:hover{background:rgba(194,82,94,.18)!important;color:#F4E4E6!important}
@keyframes ah-pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ah-pop{animation:ah-pop .18s ease-out both}
.ah-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.ah-field textarea{resize:vertical;min-height:120px;line-height:1.5}
.ah-field input::placeholder,.ah-field textarea::placeholder{color:#5E4950}
.ah-field input[type=file]{font:500 12px 'JetBrains Mono',monospace;color:#A8939A}
.ah-btn{transition:background .25s,color .25s}
.ah-btn:hover{background:rgba(194,82,94,.35)!important}
.ah-rev{transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
@keyframes ah-bob{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(3px);opacity:1}}
.ah-bob{animation:ah-bob 1.4s ease-in-out infinite}
@keyframes ah-blink{50%{opacity:0}}
.ah-caret{animation:ah-blink 1s steps(1) infinite}
@media (max-width: 860px){.ah-navlinks{display:none!important}.ah-split{grid-template-columns:1fr!important}.ah-divider{display:none!important}.ah-field{grid-template-columns:110px 1fr}}
</style>
<script src="vendor/three.min.js"></script>
<script src="vendor/morphdom-umd.min.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc-tpl">
<div style="background: #0B0709; color: #F4E4E6; font-family: 'Schibsted Grotesk', system-ui, sans-serif; position: relative">

  <!-- loader -->
  <sc-if value="{{ showLoader }}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 80; background: #0B0709; display: flex; align-items: center; justify-content: center; transition: opacity .7s ease; opacity: {{ loaderOpacity }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: Tektur, sans-serif; font-weight: 800; font-size: 40px; letter-spacing: .22em">AUDIOHEADS</span>
        <span style="font: 700 10px/1.5 'JetBrains Mono', monospace; letter-spacing: .14em">100% LOADED<br>READY TO EXPLORE</span>
      </div>
    </div>
  </sc-if>

  <!-- ===== sticky stage: 3D scene + HUD ===== -->
  <div aria-hidden="true" style="position: sticky; top: 0; height: min(100vh, 1000px); margin-bottom: calc(-1 * min(100vh, 1000px)); z-index: 0; pointer-events: none; background: #0B0709">
    <canvas id="ct-gl" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block"></canvas>
  </div>
  <div style="position: sticky; top: 0; height: min(100vh, 1000px); margin-bottom: calc(-1 * min(100vh, 1000px)); z-index: 5; pointer-events: none">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 180px; transition: opacity .3s; opacity: {{ maskOp }}; background: linear-gradient(#0B0709 0%, #0B0709 52%, rgba(11,7,9,0) 100%)"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; transition: opacity .3s; opacity: {{ maskOp }}; background: linear-gradient(rgba(11,7,9,0) 0%, #0B0709 62%)"></div>
    <div aria-hidden="true" style="position: absolute; inset: 28px; border: 1px solid rgba(230,170,178,.14); border-radius: 16px"></div>
    <header style="position: absolute; top: 44px; left: 56px; right: 52px; display: flex; align-items: center; justify-content: space-between; gap: 24px; pointer-events: auto">
      <a href="index.html" aria-label="Audioheads home" style="text-decoration: none; display: flex; align-items: center; gap: 12px; min-height: 44px">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"></rect><circle cx="11" cy="13" r="4.5" fill="currentColor"></circle><rect x="9" y="4" width="4" height="3" fill="currentColor"></rect></svg>
        <span style="font-family: Tektur, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: .24em">AUDIOHEADS</span>
      </a>
      <div style="display: flex; align-items: center; gap: 22px">
        <nav aria-label="Main" class="ah-navlinks" style="display: flex; gap: 20px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: .1em">
          <a href="about.html" style="text-decoration: none; padding: 14px 0">ABOUT</a>
          <a href="projects.html" style="text-decoration: none; padding: 14px 0">PROJECTS</a>
          <a href="index.html" style="text-decoration: none; padding: 14px 0">SERVICES</a>
          <a href="contact.html" aria-current="page" style="text-decoration: none; padding: 14px 0; border-bottom: 1px solid #C2525E">CONTACT</a>
        </nav>
        <div style="display: flex">
          <a href="#ct-form" class="ah-chamfer-l ah-btn" style="background: rgba(40,20,26,.85); text-decoration: none; padding: 0 20px; height: 44px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .12em; display: flex; align-items: center; gap: 8px">
            <svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg>
            BOOK A SERVICE
          </a>
          <a href="index.html" class="ah-chamfer-r" style="background: #F4E4E6; color: #0B0709; text-decoration: none; padding: 0 22px; height: 44px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .14em; display: flex; align-items: center; gap: 8px">
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0" y="0" width="4" height="4" fill="currentColor"></rect><rect x="6" y="0" width="4" height="4" fill="currentColor"></rect><rect x="0" y="6" width="4" height="4" fill="currentColor"></rect><rect x="6" y="6" width="4" height="4" fill="currentColor"></rect></svg>
            HOME
          </a>
        </div>
      </div>
    </header>
    <div style="position: absolute; left: 28px; right: 28px; bottom: 28px; height: 52px; border-top: 1px solid rgba(230,170,178,.14); display: flex; pointer-events: auto">
      <sc-if value="{{ notEnd }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ toggleSound }}" aria-pressed="{{ soundPressed }}" style="width: 132px; flex: none; background: none; border: none; border-right: 1px solid rgba(230,170,178,.14); color: #F4E4E6; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; cursor: pointer">
          <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 4h3l4-3v10L4 8H1z" fill="currentColor"></path><path d="{{ soundIconPath }}" stroke="currentColor" stroke-width="1.4" fill="none"></path></svg>
          {{ soundLabel }}
        </button>
      </sc-if>
      <sc-if value="{{ isEnd }}" hint-placeholder-val="{{ false }}">
        <span style="width: 200px; flex: none; display: flex; align-items: center; padding-left: 28px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">AUDIOHEADS.IN</span>
      </sc-if>
      <div style="flex: 1; position: relative">
        <div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; background: rgba(194,82,94,.12); width: {{ progW }}"></div>
        <sc-if value="{{ showCue }}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">
            <svg class="ah-bob" width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="5" y="0" width="3" height="3" fill="currentColor"></rect><rect x="2.5" y="5" width="3" height="3" fill="currentColor"></rect></svg>
            SCROLL TO EXPLORE
          </div>
        </sc-if>
      </div>
      <sc-if value="{{ notEnd }}" hint-placeholder-val="{{ true }}">
        <a href="https://wa.me/919686416156" style="width: 160px; flex: none; border-left: 1px solid rgba(230,170,178,.14); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">
          CHAT WITH US
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5.2A8 8 0 1 1 21 12z"></path></svg>
        </a>
      </sc-if>
      <sc-if value="{{ isEnd }}" hint-placeholder-val="{{ false }}">
        <div style="flex: none; border-left: 1px solid rgba(230,170,178,.14); display: flex; align-items: center; gap: 8px; padding: 0 20px">
          <a href="https://www.facebook.com/Audioheads" aria-label="Audioheads on Facebook" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A8939A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"></path></svg></a>
          <a href="https://www.instagram.com/audioheadsofficial" aria-label="Audioheads on Instagram" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A8939A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor"></circle></svg></a>
          <a href="https://wa.me/919686416156" aria-label="Audioheads on WhatsApp" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A8939A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5.2A8 8 0 1 1 21 12z"></path></svg></a>
        </div>
      </sc-if>
    </div>
  </div>

  <!-- ===== content ===== -->
  <main style="position: relative; z-index: 2">

    <!-- hero -->
    <section style="height: min(100vh, 1000px); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 26px; text-align: center; padding: 200px 40px 0; box-sizing: border-box">
      <h1 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: clamp(80px, 12.5vw, 200px); line-height: .84; text-transform: uppercase; white-space: pre; text-shadow: 0 8px 60px rgba(11,7,9,.55)"><span style="display: block">{{ h1a }}</span><span style="display: block">{{ h1b }}</span></h1>
      <p style="margin: 0; font-weight: 700; font-size: 15px; line-height: 1.45; letter-spacing: .08em; text-transform: uppercase; max-width: 520px">Contact us to book a show,<br>a service or an artist</p>
    </section>

    <!-- info + form -->
    <section id="ct-main" style="position: relative; max-width: 1480px; margin: 0 auto; padding: 200px 56px 160px; box-sizing: border-box">
      <div class="ah-divider" aria-hidden="true" style="position: absolute; left: 42%; top: 0; bottom: 0; width: 1px; background: rgba(230,170,178,.12)"></div>
      <div class="ah-split" style="display: grid; grid-template-columns: minmax(0, 42fr) minmax(0, 58fr); gap: 80px; align-items: start">

        <!-- contact info -->
        <div class="ah-rev" style="padding-left: 4%; display: flex; flex-direction: column; gap: 44px; {{ rv.info }}">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-weight: 700; font-size: 15px">ABOUT AUDIOHEADS</span>
            <span style="font: 500 11px 'JetBrains Mono', monospace; letter-spacing: .12em; color: #A8939A">CONTACT INFO</span>
          </div>
          <h2 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: clamp(48px, 5vw, 80px); line-height: .9; text-transform: uppercase">Let’s make<br>it loud</h2>
          <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #BBA5A9; max-width: 420px">Planning a show, need gear serviced, or want to book an artist? Tell us what you need and the team will get back to you.</p>
          <dl style="margin: 0; display: flex; flex-direction: column; gap: 22px">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <dt style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #A8939A">■ PHONE</dt>
              <dd style="margin: 0"><a href="tel:+919686416156" style="text-decoration: none; font-weight: 700; font-size: 22px">+91 96864 16156</a></dd>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <dt style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #A8939A">■ EMAIL</dt>
              <dd style="margin: 0"><a href="mailto:naresh@audioheads.in" style="text-decoration: none; font-weight: 700; font-size: 22px">naresh@audioheads.in</a></dd>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <dt style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #A8939A">■ SERVICE CENTRE</dt>
              <dd style="margin: 0; font-size: 16px; line-height: 1.6">657, 6th Cross Road, HAL 3rd Stage,<br>New Tippasandra, Bengaluru 560075</dd>
            </div>
          </dl>
          <div style="display: flex; flex-direction: column; gap: 12px">
            <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #A8939A">■ FOLLOW</span>
            <div style="display: flex; gap: 8px; flex-wrap: wrap">
              <a href="https://www.instagram.com/audioheadsofficial" class="ah-chamfer-cta ah-btn" style="text-decoration: none; background: rgba(50,22,30,.7); border: 1px solid rgba(230,170,178,.2); padding: 0 18px; height: 42px; display: flex; align-items: center; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">INSTAGRAM</a>
              <a href="https://www.facebook.com/Audioheads" class="ah-chamfer-cta ah-btn" style="text-decoration: none; background: rgba(50,22,30,.7); border: 1px solid rgba(230,170,178,.2); padding: 0 18px; height: 42px; display: flex; align-items: center; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">FACEBOOK</a>
              <a href="https://wa.me/919686416156" class="ah-chamfer-cta ah-btn" style="text-decoration: none; background: rgba(50,22,30,.7); border: 1px solid rgba(230,170,178,.2); padding: 0 18px; height: 42px; display: flex; align-items: center; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">WHATSAPP</a>
            </div>
          </div>
        </div>

        <!-- form -->
        <div id="ct-form" class="ah-rev" style="padding-right: 3%; {{ rv.form }}">
          <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
            <form onSubmit="{{ submit }}" aria-label="Contact form" style="display: flex; flex-direction: column; gap: 10px">
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
                <label class="ah-field"><span>FIRST NAME*</span><input name="first" required autocomplete="given-name" placeholder="Your first name"></label>
                <label class="ah-field"><span>LAST NAME*</span><input name="last" required autocomplete="family-name" placeholder="Your last name"></label>
              </div>
              <label class="ah-field"><span>EMAIL*</span><input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label>
              <div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 10px">
                <div data-dd="code" style="position: relative; z-index: {{ dd.code.z }}">
                  <div class="ah-field" style="grid-template-columns: 96px 1fr"><span id="dd-code-l">CODE</span>
                    <button type="button" class="ah-dd-btn" aria-haspopup="listbox" aria-expanded="{{ dd.code.exp }}" aria-labelledby="dd-code-l" onClick="{{ dd.code.toggle }}" onKeyDown="{{ dd.code.key }}">
                      <span>{{ dd.code.label }}</span>
                      <svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true" style="flex: none; transition: transform .2s; transform: rotate({{ dd.code.rot }})"><path d="M1 1.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg>
                    </button>
                    <input type="hidden" name="code" value="{{ dd.code.value }}">
                  </div>
                  <sc-if value="{{ dd.code.open }}" hint-placeholder-val="{{ false }}">
                    <ul role="listbox" aria-labelledby="dd-code-l" class="ah-dd ah-pop">
                      <li aria-hidden="true" style="display: flex; justify-content: space-between; padding: 8px 14px 10px; font: 700 9px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #7A6268"><span>■ SELECT</span><span>{{ dd.code.count }}</span></li>
                      <sc-for list="{{ dd.code.items }}" as="o" hint-placeholder-count="6">
                        <li role="option" aria-selected="{{ o.sel }}">
                          <button type="button" class="ah-dd-opt" onClick="{{ o.pick }}" style="{{ o.st }}">
                            <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .1em; width: 22px; color: {{ o.numC }}">{{ o.n }}</span>
                            <span style="flex: 1">{{ o.label }}</span>
                            <span aria-hidden="true" style="width: 7px; height: 7px; background: {{ o.dot }}"></span>
                          </button>
                        </li>
                      </sc-for>
                    </ul>
                  </sc-if>
                </div>
                <label class="ah-field" style="grid-template-columns: 96px 1fr"><span>PHONE*</span><input name="phone" type="tel" required autocomplete="tel-national" placeholder="98765 43210"></label>
              </div>
              <div data-dd="topic" style="position: relative; z-index: {{ dd.topic.z }}">
                  <div class="ah-field"><span id="dd-topic-l">I NEED HELP WITH</span>
                    <button type="button" class="ah-dd-btn" aria-haspopup="listbox" aria-expanded="{{ dd.topic.exp }}" aria-labelledby="dd-topic-l" onClick="{{ dd.topic.toggle }}" onKeyDown="{{ dd.topic.key }}">
                      <span>{{ dd.topic.label }}</span>
                      <svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true" style="flex: none; transition: transform .2s; transform: rotate({{ dd.topic.rot }})"><path d="M1 1.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg>
                    </button>
                    <input type="hidden" name="topic" value="{{ dd.topic.value }}">
                  </div>
                  <sc-if value="{{ dd.topic.open }}" hint-placeholder-val="{{ false }}">
                    <ul role="listbox" aria-labelledby="dd-topic-l" class="ah-dd ah-pop">
                      <li aria-hidden="true" style="display: flex; justify-content: space-between; padding: 8px 14px 10px; font: 700 9px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #7A6268"><span>■ SELECT</span><span>{{ dd.topic.count }}</span></li>
                      <sc-for list="{{ dd.topic.items }}" as="o" hint-placeholder-count="6">
                        <li role="option" aria-selected="{{ o.sel }}">
                          <button type="button" class="ah-dd-opt" onClick="{{ o.pick }}" style="{{ o.st }}">
                            <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .1em; width: 22px; color: {{ o.numC }}">{{ o.n }}</span>
                            <span style="flex: 1">{{ o.label }}</span>
                            <span aria-hidden="true" style="width: 7px; height: 7px; background: {{ o.dot }}"></span>
                          </button>
                        </li>
                      </sc-for>
                    </ul>
                  </sc-if>
                </div>

      pickFile: (e) => { var f = e && e.target && e.target.files && e.target.files[0]; this.setState({ fileName: f ? f.name : '' }); },
      reset: () => this.setState({ sent: false, ddOpen: null, code: '+91', topic: 'Live show production', fileName: '' }),
      progW: (s.p * 100).toFixed(2) + '%',
      showCue: s.p < 0.03, isEnd: s.endZone, notEnd: !s.endZone,
      soundLabel: s.sound ? 'SOUND ON' : 'SOUND OFF', soundPressed: s.sound ? 'true' : 'false',
      soundIconPath: s.sound ? 'M11 3.5c1.2 1 1.2 4 0 5M13 1.5c2.3 2 2.3 7 0 9' : 'M11 4l4 4M15 4l-4 4',
      toggleSound: () => this.toggleSound()
    };
  }
}

</script>
<script>DC.mount(Component, {"accent": "#C2525E"});</script>
