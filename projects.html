<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audioheads — Projects map</title>
<meta name="description" content="Audioheads: live show production, A/V rental and integration, an authorised Pioneer DJ service centre and artist management in Bengaluru since 2008.">
<meta name="theme-color" content="#0B0709">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' fill='%230B0709'/%3E%3Crect x='2' y='2' width='18' height='18' fill='none' stroke='%23C2525E' stroke-width='2'/%3E%3Ccircle cx='11' cy='13' r='4.5' fill='%23C2525E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Tektur:wght@600;800&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0709;overflow:hidden}
a{color:#F4E4E6}a:hover{color:#FFFFFF}
.ah-chamfer-l{clip-path:polygon(12px 0,100% 0,100% 100%,0 100%,0 12px)}
.ah-chamfer-r{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.ah-chamfer-cta{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.ah-card{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.ah-card-b{clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}
.ah-panel{clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
.ah-btn{transition:background .25s,color .25s}
.ah-btn:hover{background:rgba(194,82,94,.35)!important}
.ah-row{transition:background .2s}
.ah-row:hover{background:rgba(11,7,9,.06)!important}
.ah-pin{transition:transform .25s}
.ah-pin:hover{transform:translate(-50%,-50%) scale(1.12)!important}
@keyframes ah-ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.ah-ping{animation:ah-ping 1.8s ease-out infinite}
@keyframes ah-fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ah-fade{animation:ah-fade .6s cubic-bezier(.2,.7,.2,1) both}
@media (max-width: 860px){.ah-navlinks{display:none!important}.ah-rail{display:none!important}}
</style>

<script src="vendor/morphdom-umd.min.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc-tpl">
<div id="pj-root" style="position: relative; height: min(100vh, 1000px); min-height: 640px; overflow: hidden; background: #0B0709; color: #F4E4E6; font-family: 'Schibsted Grotesk', system-ui, sans-serif">
  <canvas id="pj-map" aria-label="Interactive map of Audioheads projects and talent cities" role="img" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: {{ mapCursor }}"></canvas>
  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(11,7,9,.75) 100%)"></div>

  <!-- pins -->
  <sc-for list="{{ pins }}" as="p" hint-placeholder-count="12">
    <sc-if value="{{ p.show }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ p.pick }}" class="ah-pin" aria-label="{{ p.aria }}" style="position: absolute; z-index: {{ p.z }}; width: 14px; height: 14px; background: none; border: none; padding: 0; cursor: pointer; transform: translate(-50%, -50%); {{ p.pos }}">
        <sc-if value="{{ p.labelOn }}" hint-placeholder-val="{{ true }}">
          <span class="ah-card" style="position: absolute; white-space: nowrap; padding: 7px 14px 7px 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .12em; {{ p.labPos }} {{ p.tag }}">{{ p.short }}</span>
        </sc-if>
        <span style="position: absolute; inset: 0; display: block">
          <span class="ah-ping" style="position: absolute; inset: 0; border: 1.5px solid {{ accent }}"></span>
          <span style="position: absolute; inset: 2px; {{ p.dot }}"></span>
        </span>
      </button>
    </sc-if>
  </sc-for>

  <!-- HUD frame -->
  <div aria-hidden="true" style="position: absolute; inset: 28px; border: 1px solid rgba(230,170,178,.14); border-radius: 16px; pointer-events: none; z-index: 4"></div>

  <!-- header -->
  <header style="position: absolute; top: 44px; left: 56px; right: 52px; display: flex; align-items: center; justify-content: space-between; gap: 24px; z-index: 6">
    <a href="index.html" aria-label="Audioheads home" style="text-decoration: none; display: flex; align-items: center; gap: 12px; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"></rect><circle cx="11" cy="13" r="4.5" fill="currentColor"></circle><rect x="9" y="4" width="4" height="3" fill="currentColor"></rect></svg>
      <span style="font-family: Tektur, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: .24em">AUDIOHEADS</span>
    </a>
    <div style="display: flex; align-items: center; gap: 22px">
      <nav aria-label="Main" class="ah-navlinks" style="display: flex; gap: 20px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: .1em">
        <a href="about.html" style="text-decoration: none; padding: 14px 0">ABOUT</a>
        <a href="projects.html" aria-current="page" style="text-decoration: none; padding: 14px 0; border-bottom: 1px solid #C2525E">PROJECTS</a>
        <a href="index.html" style="text-decoration: none; padding: 14px 0">SERVICES</a>
        <a href="contact.html" style="text-decoration: none; padding: 14px 0">CONTACT</a>
      </nav>
      <div style="display: flex">
        <a href="contact.html" class="ah-chamfer-l ah-btn" style="background: rgba(40,20,26,.85); text-decoration: none; padding: 0 20px; height: 44px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .12em; display: flex; align-items: center; gap: 8px">
          <svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg>
          BOOK A SERVICE
        </a>
        <a href="index.html" class="ah-chamfer-r" style="background: #F4E4E6; color: #0B0709; text-decoration: none; padding: 0 22px; height: 44px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .14em; display: flex; align-items: center; gap: 8px">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0" y="0" width="4" height="4" fill="currentColor"></rect><rect x="6" y="0" width="4" height="4" fill="currentColor"></rect><rect x="0" y="6" width="4" height="4" fill="currentColor"></rect><rect x="6" y="6" width="4" height="4" fill="currentColor"></rect></svg>
          HOME
        </a>
      </div>
    </div>
  </header>

  <!-- region rail -->
  <nav aria-label="Regions" class="ah-rail" style="position: absolute; left: 44px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 2px; z-index: 6">
    <sc-for list="{{ regions }}" as="r" hint-placeholder-count="5">
      <button type="button" onClick="{{ r.go }}" style="background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 7px 0; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .2em; text-align: left; {{ r.st }}">
        <span style="width: 6px; height: 6px; {{ r.dot }}"></span>{{ r.label }}
      </button>
    </sc-for>
  </nav>

  <!-- zoom scale -->
  <div aria-hidden="true" style="position: absolute; left: 58px; bottom: 104px; z-index: 6; display: flex; flex-direction: column; gap: 6px; font: 700 9px 'JetBrains Mono', monospace; letter-spacing: .12em; color: #F4E4E6">
    <div style="display: flex; justify-content: space-between; gap: 30px; width: {{ scaleW }}"><span>ZOOM {{ zoomLabel }}</span><span>{{ scaleLabel }}</span></div>
    <div style="height: 5px; border: 1px solid #F4E4E6; border-top: none; width: {{ scaleW }}"></div>
  </div>

  <!-- compass -->
  <div aria-hidden="true" style="position: absolute; right: 62px; bottom: 98px; z-index: 6; width: 110px; height: 110px; font: 700 9px 'JetBrains Mono', monospace; color: #F4E4E6">
    <svg width="110" height="110" viewBox="0 0 110 110" style="position: absolute; inset: 0"><circle cx="55" cy="55" r="34" fill="rgba(11,7,9,.55)" stroke="rgba(244,228,230,.35)"></circle><path d="M55 10v10M55 90v10M10 55h10M90 55h10" stroke="#F4E4E6"></path><path d="M55 26l5 9h-10z" fill="#F4E4E6"></path></svg>
    <span style="position: absolute; left: 51px; top: 0">N</span><span style="position: absolute; left: 52px; bottom: 0">S</span><span style="position: absolute; left: 0; top: 50px">W</span><span style="position: absolute; right: 0; top: 50px">E</span>
    <span style="position: absolute; left: 0; right: 0; top: 40px; text-align: center; font: 700 22px 'Schibsted Grotesk', sans-serif">N</span>
    <span style="position: absolute; left: 0; right: 0; top: 66px; text-align: center">000°</span>
  </div>

  <!-- bottom bar -->
  <div style="position: absolute; left: 28px; right: 28px; bottom: 28px; height: 52px; border-top: 1px solid rgba(230,170,178,.14); display: flex; z-index: 6">
    <button type="button" onClick="{{ toggleSound }}" aria-pressed="{{ soundPressed }}" style="width: 132px; flex: none; background: none; border: none; border-right: 1px solid rgba(230,170,178,.14); color: #F4E4E6; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; cursor: pointer">
      <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 4h3l4-3v10L4 8H1z" fill="currentColor"></path><path d="{{ soundIconPath }}" stroke="currentColor" stroke-width="1.4" fill="none"></path></svg>
      {{ soundLabel }}
    </button>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center">
      <button type="button" onClick="{{ openList }}" style="background: none; border: none; color: #F4E4E6; display: flex; align-items: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; cursor: pointer; min-height: 44px; padding: 0 16px">
        <svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true"><path d="M0 1h12M0 5h12M0 9h12" stroke="currentColor" stroke-width="1.5"></path></svg>
        OPEN PROJECT LIST
      </button>
    </div>
    <button type="button" onClick="{{ toggleFilters }}" aria-expanded="{{ filtersExpanded }}" style="width: 160px; flex: none; background: none; border: none; border-left: 1px solid rgba(230,170,178,.14); color: #F4E4E6; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; cursor: pointer">
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0v10M0 5h10" stroke="currentColor" stroke-width="1.5"></path></svg>
      FILTERS [{{ filterCount }}]
    </button>
  </div>

  <!-- filters popover -->
  <sc-if value="{{ filtersOpen }}" hint-placeholder-val="{{ false }}">
    <div class="ah-card ah-fade" style="position: absolute; right: 28px; bottom: 92px; z-index: 7; width: 300px; background: rgba(24,12,16,.95); border: 1px solid rgba(230,170,178,.18); padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #A8939A">FILTER BY TYPE</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
          <button type="button" onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="padding: 0 14px; height: 36px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .12em; cursor: pointer; {{ c.st }}">{{ c.label }}</button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <!-- project listing panel -->
  <sc-if value="{{ listOpen }}" hint-placeholder-val="{{ false }}">
    <section aria-label="Project listing" class="ah-panel ah-fade" style="position: absolute; left: 40px; top: 40px; bottom: 40px; width: min(440px, calc(100% - 80px)); z-index: 8; background: #F4E4E6; color: #0B0709; display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 18px 0 22px">
        <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">■ PROJECTS OPEN</span>
        <button type="button" onClick="{{ closeList }}" class="ah-chamfer-r" style="background: #0B0709; color: #F4E4E6; border: none; height: 40px; padding: 0 18px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; cursor: pointer; display: flex; align-items: center; gap: 8px">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.6"></path></svg>CLOSE
        </button>
      </div>
      <h2 style="margin: 0; padding: 40px 22px 34px; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 64px; line-height: .86; text-transform: uppercase">Project<br>listing</h2>
      <ul style="list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; border-top: 1px solid rgba(11,7,9,.12)">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
          <li style="border-bottom: 1px solid rgba(11,7,9,.12)">
            <button type="button" onClick="{{ r.pick }}" class="ah-row" style="width: 100%; background: transparent; border: none; text-align: left; cursor: pointer; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; gap: 16px; color: #0B0709; min-height: 56px">
              <span style="display: flex; flex-direction: column; gap: 3px">
                <span style="font-weight: 700; font-size: 14px">{{ r.name }}</span>
                <span style="font-size: 12px; color: #6B5258">{{ r.status }}</span>
              </span>
              <span style="font: 700 9px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #6B5258">{{ r.cityU }}</span>
            </button>
          </li>
        </sc-for>
      </ul>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 22px 26px; border-top: 1px solid rgba(11,7,9,.12)">
        <span style="font: 700 9px 'JetBrains Mono', monospace; letter-spacing: .14em">FILTER BY TYPE</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end">
          <sc-for list="{{ chipsLight }}" as="c" hint-placeholder-count="4">
            <button type="button" onClick="{{ c.pick }}" aria-pressed="{{ c.pressed }}" style="padding: 0 10px; height: 32px; font: 700 9px 'JetBrains Mono', monospace; letter-spacing: .12em; cursor: pointer; {{ c.st }}">{{ c.label }}</button>
          </sc-for>
        </div>
      </div>
    </section>
  </sc-if>

  <!-- detail card -->
  <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
    <article class="ah-card ah-fade" aria-live="polite" style="position: absolute; right: 52px; top: 120px; z-index: 7; width: min(380px, calc(100% - 104px)); background: rgba(24,12,16,.94); backdrop-filter: blur(10px); border: 1px solid rgba(230,170,178,.18); padding: 24px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: {{ accent }}">■ {{ sel.type }}</span>
        <button type="button" onClick="{{ closeSel }}" aria-label="Close details" style="width: 36px; height: 36px; background: rgba(244,228,230,.08); border: none; color: #F4E4E6; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.6"></path></svg>
        </button>
      </div>
      <h3 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 44px; line-height: .92; text-transform: uppercase">{{ sel.name }}</h3>
      <dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .1em">
        <dt>CITY</dt><dd style="margin: 0; color: #A8939A">{{ sel.cityU }}</dd>
        <dt>DETAIL</dt><dd style="margin: 0; color: #A8939A">{{ sel.statusU }}</dd>
        <dt>COORDS</dt><dd style="margin: 0; color: #A8939A">{{ sel.coords }}</dd>
      </dl>
      <p style="margin: 0; font-size: 14px; line-height: 1.65; color: #BBA5A9">{{ sel.desc }}</p>
      <a href="contact.html" class="ah-chamfer-cta ah-btn" style="align-self: flex-start; text-decoration: none; background: rgba(50,22,30,.8); border: 1px solid rgba(230,170,178,.2); padding: 0 20px; height: 42px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; display: flex; align-items: center; gap: 10px">
        <svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg>
        ENQUIRE
      </a>
    </article>
  </sc-if>

  <!-- intro: how to use the map -->
  <sc-if value="{{ introOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 9; background: rgba(11,7,9,.72); backdrop-filter: blur(4px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; padding: 120px 40px; box-sizing: border-box">
      <h1 class="ah-fade" style="margin: 0; text-align: center; font-weight: 700; font-size: clamp(40px, 4.4vw, 64px); line-height: 1; text-transform: uppercase">How to use<br>the map</h1>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 230px)); gap: 12px">
        <sc-for list="{{ howCards }}" as="h" hint-placeholder-count="3">
          <div class="{{ h.cls }}" style="background: rgba(32,16,21,.82); border: 1px solid rgba(230,170,178,.12); padding: 16px; min-height: 270px; display: flex; flex-direction: column; justify-content: space-between; {{ h.anim }}">
            <span style="align-self: flex-end; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .1em">■ {{ h.n }}</span>
            <span aria-hidden="true" style="align-self: center; width: 96px; height: 96px; border-radius: 50%; background: rgba(244,228,230,.06); display: flex; align-items: center; justify-content: center">
              <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#F4E4E6" stroke-width="1.6"><path d="M12 9l14 6-6 2-2 6z"></path><path d="{{ h.icon }}"></path></svg>
            </span>
            <span style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-weight: 800; font-size: 20px">{{ h.title }}</span>
              <span style="font-size: 14px; color: #A8939A">{{ h.body }}</span>
            </span>
          </div>
        </sc-for>
      </div>
      <button type="button" onClick="{{ enterMap }}" class="ah-chamfer-cta" style="background: #F4E4E6; color: #0B0709; border: none; height: 46px; padding: 0 26px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .14em; cursor: pointer; display: flex; align-items: center; gap: 10px">
        <svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg>
        ENTER THE MAP
      </button>
    </div>
  </sc-if>
</div>
</template>
<div id="dc-root"></div>
<script>

var PJ_PINS = [
  { id: 'svc', lab: 'R', name: 'Audioheads Service Centre', short: 'SERVICE CENTRE', type: 'SERVICE', status: 'Authorised service · Pioneer DJ & more', city: 'Bengaluru', lon: 77.652, lat: 12.973, desc: 'Authorised repair and service for Pioneer DJ, Turbosound, Lab Gruppen, TC Electronic, Yamaha, Grundig and Kenwood, at 657, 6th Cross Road, HAL 3rd Stage, New Tippasandra.' },
  { id: 'digweed', lab: 'L', name: 'John Digweed', short: 'JOHN DIGWEED · 2011', type: 'SHOW', status: 'Show production · 2011', city: 'Bengaluru', lon: 77.585, lat: 12.948, desc: 'Live show production for John Digweed in Bangalore in 2011.' },
  { id: 'tiesto', lab: 'R', name: 'Tiësto After Party', short: 'TIËSTO AFTER PARTY · 2008', type: 'SHOW', status: 'Show production · 2008', city: 'Hyderabad', lon: 78.476, lat: 17.395, desc: 'After-party production for Tiësto in Hyderabad in 2008.' },
  { id: 'sultan', lab: 'L', name: 'SULTAN by Submerge', short: 'SULTAN BY SUBMERGE · 2009', type: 'SHOW', status: 'Show production · 2009', city: 'Hyderabad', lon: 78.405, lat: 17.445, desc: 'Show production for SULTAN by Submerge in Hyderabad in 2009.' },
  { id: 'blr', lab: 'T', name: 'Bengaluru talent hub', short: 'TALENT · BENGALURU', type: 'TALENT', status: 'Artist & DJ management', city: 'Bengaluru', lon: 77.61, lat: 12.995, desc: 'Home base for our artist and DJ management in India and abroad.' },
  { id: 'goa', name: 'Goa', short: 'TALENT · GOA', type: 'TALENT', status: 'Artist & DJ management', city: 'Goa', lon: 74.12, lat: 15.30, desc: 'Talent operations for artists and DJs in Goa.' },
  { id: 'dxb', name: 'Dubai', short: 'TALENT · DUBAI', type: 'TALENT', status: 'Artist & DJ management', city: 'Dubai', lon: 55.27, lat: 25.20, desc: 'Talent operations for artists and DJs in Dubai.' },
  { id: 'doh', lab: 'L', name: 'Qatar', short: 'TALENT · QATAR', type: 'TALENT', status: 'Artist & DJ management', city: 'Doha, Qatar', lon: 51.53, lat: 25.29, desc: 'Talent operations for artists and DJs in Qatar.' },
