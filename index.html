<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audioheads — Live events, sound and service, Bengaluru</title>
<meta name="description" content="Audioheads: live show production, A/V rental and integration, an authorised Pioneer DJ service centre and artist management in Bengaluru since 2008.">
<meta name="theme-color" content="#0B0709">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' fill='%230B0709'/%3E%3Crect x='2' y='2' width='18' height='18' fill='none' stroke='%23C2525E' stroke-width='2'/%3E%3Ccircle cx='11' cy='13' r='4.5' fill='%23C2525E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Tektur:wght@600;800&amp;display=swap">
<style>
body{margin:0;background:#0B0709}
a{color:#F4E4E6}a:hover{color:#FFFFFF}
.ah-chamfer-l{clip-path:polygon(12px 0,100% 0,100% 100%,0 100%,0 12px)}
.ah-chamfer-r{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.ah-chamfer-cta{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.ah-btn{transition:background .25s,color .25s}
.ah-btn:hover{background:rgba(194,82,94,.35)!important}
.ah-rail-btn{transition:color .3s}
.ah-rail-btn:hover{color:#F4E4E6!important}
@keyframes ah-bob{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(3px);opacity:1}}
.ah-bob{animation:ah-bob 1.4s ease-in-out infinite}
@media (max-width: 860px){.ah-rail{display:none!important}.ah-navlinks{display:none!important}}
</style>
<script src="vendor/three.min.js"></script>
<script src="vendor/morphdom-umd.min.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc-tpl">
<div style="background: #0B0709; color: #F4E4E6; font-family: 'Schibsted Grotesk', system-ui, sans-serif; position: relative">

  <!-- ================= LOADER ================= -->
  <sc-if value="{{ showLoader }}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 80; background: #0B0709; display: flex; align-items: center; justify-content: center; transition: opacity .8s ease; opacity: {{ loaderOpacity }}">
      <div style="display: flex; flex-direction: column; gap: 10px; width: 176px">
        <span style="align-self: flex-end; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .12em; color: #A8939A">{{ pct }}%</span>
        <div style="display: flex; justify-content: space-between">
          <sc-for list="{{ squares }}" as="q" hint-placeholder-count="13">
            <span style="width: 6px; height: 6px; transition: background .2s; {{ q.st }}"></span>
          </sc-for>
        </div>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: #A8939A">{{ loaderLabel }}</span>
      </div>
    </div>
  </sc-if>

  <!-- ================= MENU OVERLAY ================= -->
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 70; background: rgba(11,7,9,.96); backdrop-filter: blur(12px); overflow-y: auto">
      <div style="min-height: 100%; box-sizing: border-box; padding: 40px 56px; display: flex; flex-direction: column; gap: 56px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-family: Tektur, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: .22em">AUDIOHEADS</span>
          <button type="button" onClick="{{ closeMenu }}" class="ah-chamfer-r" style="background: #F4E4E6; color: #0B0709; border: none; padding: 14px 22px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .16em; cursor: pointer; min-height: 44px">CLOSE</button>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 56px; justify-content: space-between; flex: 1">
          <nav aria-label="Menu" style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 420px">
            <sc-for list="{{ menuLinks }}" as="m" hint-placeholder-count="6">
              <sc-if value="{{ m.isLink }}" hint-placeholder-val="{{ false }}">
              <a href="{{ m.href }}" style="text-decoration: none; color: #F4E4E6; padding: 6px 0; display: flex; align-items: baseline; gap: 20px; min-height: 44px">
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .14em; color: #7A6268">{{ m.n }}</span>
                <span style="font-weight: 700; font-size: clamp(36px, 5.4vw, 72px); line-height: 1.04; letter-spacing: -.01em; text-transform: uppercase">{{ m.label }}</span>
              </a>
              </sc-if>
              <sc-if value="{{ m.isBtn }}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{ m.go }}" style="background: none; border: none; color: #F4E4E6; text-align: left; padding: 6px 0; cursor: pointer; display: flex; align-items: baseline; gap: 20px; min-height: 44px">
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .14em; color: #7A6268">{{ m.n }}</span>
                <span style="font-weight: 700; font-size: clamp(36px, 5.4vw, 72px); line-height: 1.04; letter-spacing: -.01em; text-transform: uppercase">{{ m.label }}</span>
              </button>
              </sc-if>
            </sc-for>
          </nav>
          <div style="flex: 0 1 360px; display: flex; flex-direction: column; gap: 28px; font-size: 15px; line-height: 1.6">
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em; color: #7A6268">VISIT</span>
              <span>657, 6th Cross Road, HAL 3rd Stage,<br>New Tippasandra, Bengaluru 560075</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em; color: #7A6268">TALK</span>
              <a href="tel:+919686416156" style="text-decoration: none">+91 96864 16156</a>
              <a href="mailto:naresh@audioheads.in" style="text-decoration: none">naresh@audioheads.in</a>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em; color: #7A6268">FOLLOW</span>
              <a href="https://www.facebook.com/Audioheads" style="text-decoration: none">Facebook</a>
              <a href="https://www.instagram.com/audioheadsofficial" style="text-decoration: none">Instagram</a>
            </div>
            <a href="https://wa.me/919686416156" class="ah-chamfer-cta" style="text-decoration: none; background: rgba(110,40,52,.45); border: 1px solid rgba(230,170,178,.25); padding: 16px 22px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .16em; align-self: flex-start; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center">CHAT ON WHATSAPP</a>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 24px; border-top: 1px solid rgba(230,170,178,.14); padding-top: 24px">
          <div style="display: flex; align-items: baseline; gap: 12px"><span style="font-weight: 700; font-size: 30px">2008</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .16em; color: #A8939A">FOUNDED</span></div>
          <div style="display: flex; align-items: baseline; gap: 12px"><span style="font-weight: 700; font-size: 30px">15K</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .16em; color: #A8939A">MAX CROWD</span></div>
          <div style="display: flex; align-items: baseline; gap: 12px"><span style="font-weight: 700; font-size: 30px">07</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .16em; color: #A8939A">BRANDS SERVICED</span></div>
          <div style="display: flex; align-items: baseline; gap: 12px"><span style="font-weight: 700; font-size: 30px">08</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .16em; color: #A8939A">TALENT CITIES</span></div>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- ================= STAGE (sticky) ================= -->
  <div id="ah-stage" style="position: sticky; top: 0; height: min(100vh, 1000px); overflow: hidden; background: radial-gradient(ellipse 60% 50% at 50% 55%, #5A1E26 0%, #1E0C10 50%, #0B0709 85%)">

    <canvas id="ah-gl" onClick="{{ stageClick }}" aria-label="3D journey through the Audioheads world" role="img" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: {{ canvasCursor }}"></canvas>

    <!-- HUD frame -->
    <div aria-hidden="true" style="position: absolute; inset: 28px; border: 1px solid rgba(230,170,178,.14); border-radius: 16px; pointer-events: none"></div>

    <!-- header -->
    <header style="position: absolute; top: 44px; left: 56px; right: 52px; display: flex; align-items: center; justify-content: space-between; gap: 24px; z-index: 5">
      <button type="button" onClick="{{ goTop }}" aria-label="Audioheads home" style="background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; gap: 12px; color: #F4E4E6; min-height: 44px">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"></rect><circle cx="11" cy="13" r="4.5" fill="currentColor"></circle><rect x="9" y="4" width="4" height="3" fill="currentColor"></rect></svg>
        <span style="font-family: Tektur, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: .24em">AUDIOHEADS</span>
      </button>
      <div style="display: flex; align-items: center; gap: 22px">
        <nav aria-label="Main" class="ah-navlinks" style="display: flex; gap: 20px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: .1em">
          <sc-for list="{{ navLinks }}" as="n" hint-placeholder-count="5">
            <sc-if value="{{ n.isLink }}" hint-placeholder-val="{{ false }}"><a href="{{ n.href }}" style="text-decoration: none; color: #F4E4E6; padding: 14px 0; min-height: 44px; box-sizing: border-box">{{ n.label }}</a></sc-if>
            <sc-if value="{{ n.isBtn }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ n.go }}" style="background: none; border: none; color: #F4E4E6; font: inherit; letter-spacing: inherit; cursor: pointer; padding: 12px 0; min-height: 44px">{{ n.label }}</button></sc-if>
          </sc-for>
        </nav>
        <div style="display: flex">
          <a href="contact.html" class="ah-chamfer-l ah-btn" style="background: rgba(40,20,26,.85); color: #F4E4E6; text-decoration: none; padding: 0 20px; height: 44px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .12em; display: flex; align-items: center; gap: 8px">
            <svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg>
            BOOK A SERVICE
          </a>
          <button type="button" onClick="{{ openMenu }}" aria-expanded="{{ menuExpanded }}" class="ah-chamfer-r" style="background: #F4E4E6; color: #0B0709; border: none; padding: 0 22px; height: 44px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .14em; cursor: pointer; display: flex; align-items: center; gap: 8px">
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0" y="0" width="4" height="4" fill="currentColor"></rect><rect x="6" y="0" width="4" height="4" fill="currentColor"></rect><rect x="0" y="6" width="4" height="4" fill="currentColor"></rect><rect x="6" y="6" width="4" height="4" fill="currentColor"></rect></svg>
            MENU
          </button>
        </div>
      </div>
    </header>

    <!-- legibility scrims -->
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 190px; z-index: 3; pointer-events: none; background: linear-gradient(rgba(11,7,9,.82), rgba(11,7,9,.45) 50%, rgba(11,7,9,0))"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 240px; z-index: 3; pointer-events: none; background: linear-gradient(90deg, rgba(11,7,9,.8), rgba(11,7,9,.4) 55%, rgba(11,7,9,0))"></div>
    <div aria-hidden="true" style="position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); width: min(1100px, 100%); height: 460px; z-index: 3; pointer-events: none; opacity: {{ scrimOp }}; transition: opacity .25s linear; background: radial-gradient(ellipse 50% 50% at 50% 62%, rgba(11,7,9,.88) 0%, rgba(11,7,9,.7) 45%, rgba(11,7,9,0) 100%)"></div>

    <!-- left chapter rail -->
    <nav aria-label="Chapters" class="ah-rail" style="position: absolute; left: 32px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 2px; z-index: 5; padding: 10px 16px 10px 12px; background: rgba(11,7,9,.62); backdrop-filter: blur(8px); border: 1px solid rgba(230,170,178,.08)">
      <sc-for list="{{ rail }}" as="r" hint-placeholder-count="6">
        <button type="button" onClick="{{ r.go }}" class="ah-rail-btn" style="background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 7px 0; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 10px; letter-spacing: .2em; text-align: left; {{ r.st }}">
          <span style="width: 6px; height: 6px; {{ r.dot }}"></span>{{ r.label }}
        </button>
      </sc-for>
    </nav>

    <!-- chapter text -->
    <div style="position: absolute; left: 50%; bottom: 128px; transform: translate(-50%, {{ textLift }}); width: min(640px, 86%); display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; z-index: 4; pointer-events: none; opacity: {{ textOp }}; filter: blur({{ textBlur }}); transition: opacity .18s linear, filter .18s linear, transform .18s linear; will-change: opacity, transform, filter">
      <h1 style="margin: 0; font-weight: 700; font-size: clamp(26px, 2.7vw, 38px); line-height: 1.08; letter-spacing: .035em; text-transform: uppercase; color: #F4E4E6; white-space: pre; text-shadow: 0 2px 24px rgba(11,7,9,.9), 0 0 2px rgba(11,7,9,.8)"><span style="display: block">{{ l1 }}</span><span style="display: block">{{ l2 }}</span></h1>
      <p style="margin: 0; max-width: 490px; font-size: 14px; line-height: 1.6; color: #D4C0C4; opacity: {{ bodyOp }}; text-shadow: 0 1px 12px rgba(11,7,9,1), 0 0 3px rgba(11,7,9,.9)">{{ body }}</p>
      <sc-if value="{{ hasCta }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ ctaGo }}" class="ah-chamfer-cta ah-btn" style="pointer-events: auto; margin-top: 10px; background: rgba(50,22,30,.6); backdrop-filter: blur(6px); border: 1px solid rgba(230,170,178,.2); color: #F4E4E6; padding: 0 24px; height: 44px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .14em; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: opacity .4s; opacity: {{ bodyOp }}">
          <svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg>
          {{ cta }}
        </button>
      </sc-if>
    </div>

    <!-- bottom HUD bar -->
    <div style="position: absolute; left: 28px; right: 28px; bottom: 28px; height: 52px; border-top: 1px solid rgba(230,170,178,.14); display: flex; z-index: 5">
      <sc-if value="{{ notEnd }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ toggleSound }}" aria-pressed="{{ soundPressed }}" style="width: 132px; flex: none; background: none; border: none; border-right: 1px solid rgba(230,170,178,.14); color: #F4E4E6; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; cursor: pointer">
          <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 4h3l4-3v10L4 8H1z" fill="currentColor"></path><path d="{{ soundIconPath }}" stroke="currentColor" stroke-width="1.4" fill="none"></path></svg>
          {{ soundLabel }}
        </button>
      </sc-if>
      <sc-if value="{{ isEnd }}" hint-placeholder-val="{{ false }}">
        <span style="width: 200px; flex: none; display: flex; align-items: center; padding-left: 28px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">AUDIOHEADS.IN</span>
      </sc-if>
      <div style="flex: 1; position: relative">
        <div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; background: rgba(194,82,94,.12); width: {{ progW }}"></div>
        <sc-if value="{{ showCue }}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #F4E4E6">
            <svg class="ah-bob" width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="5" y="0" width="3" height="3" fill="currentColor"></rect><rect x="2.5" y="5" width="3" height="3" fill="currentColor"></rect></svg>
            SCROLL TO EXPLORE
          </div>
        </sc-if>
      </div>
      <sc-if value="{{ notEnd }}" hint-placeholder-val="{{ true }}">
        <a href="https://wa.me/919686416156" style="width: 160px; flex: none; border-left: 1px solid rgba(230,170,178,.14); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">
          CHAT WITH US
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5.2A8 8 0 1 1 21 12z"></path></svg>
        </a>
      </sc-if>
      <sc-if value="{{ isEnd }}" hint-placeholder-val="{{ false }}">
        <div style="flex: none; border-left: 1px solid rgba(230,170,178,.14); display: flex; align-items: center; gap: 8px; padding: 0 20px">
          <a href="https://www.facebook.com/Audioheads" aria-label="Audioheads on Facebook" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A8939A">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"></path></svg>
          </a>
          <a href="https://www.instagram.com/audioheadsofficial" aria-label="Audioheads on Instagram" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A8939A">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor"></circle></svg>
          </a>
        </div>
      </sc-if>
    </div>

    <!-- cursor tag -->
    <sc-if value="{{ showTag }}" hint-placeholder-val="{{ false }}">
      <div aria-hidden="true" style="position: absolute; pointer-events: none; z-index: 6; display: flex; gap: 6px; font: 700 9px/1.3 'JetBrains Mono', monospace; letter-spacing: .12em; color: #F4E4E6; transition: opacity .6s ease, transform .6s ease; opacity: {{ tagOp }}; transform: translateY({{ tagLift }}); left: {{ tagX }}; top: {{ tagY }}">
        <span style="width: 6px; height: 6px; background: #F4E4E6; margin-top: 2px"></span>
        <span>CLICK TO<br>ENABLE AUDIO</span>
      </div>
    </sc-if>
  </div>

  <!-- scroll track -->
  <div aria-hidden="true" style="height: 8000px"></div>
</div>
</template>
<div id="dc-root"></div>
<script>

var AH_CH = [
  { k: 'ENGAGE', l1: 'WE BRING LIVE EVENTS', l2: 'TO LIFE', body: 'Since 2008, Audioheads has delivered full-service live event production, high-end A/V rental and integration, from first design to final load-out, in venues of any size.', cta: 'EXPLORE OUR SERVICES', act: 'next' },
  { k: 'SOUND', l1: 'WE DESIGN, SELL AND', l2: 'INSTALL SOUND SYSTEMS', body: 'Pro-sound, pro-light, studio and DJ gear from Pioneer, Novation, Traktor and Native Instruments, installed in clubs, auditoriums, conference rooms and command centres. We also treat rooms acoustically, with a consultant’s report.', cta: 'GET A QUOTE', act: 'menu' },
  { k: 'LIGHT', l1: 'WE STAGE SHOWS FOR', l2: '500 TO 15,000 PEOPLE', body: 'End-to-end production and rentals for music events, from Tiësto’s After Party and SULTAN by Submerge in Hyderabad to John Digweed in Bangalore. Registered vendor with the Government of Singapore and ITPL.', cta: 'WORK WITH US', act: 'menu' },
  { k: 'SERVICE', l1: 'WE KEEP THE BOOTH', l2: 'RUNNING', body: 'Bangalore’s authorised service centre for Pioneer DJ, Turbosound, Lab Gruppen, TC Electronic, Yamaha, Grundig and Kenwood, with trained technicians on site.', cta: 'BOOK A REPAIR', act: 'menu' },
  { k: 'TALENT', l1: 'WE TAKE ARTISTS', l2: 'AROUND THE WORLD', body: 'Artist and DJ management in India and abroad, across Bangalore, Goa, Dubai, Qatar, London, Toronto, Montreal and Manila.', cta: '', act: '' },
  { k: 'LEGACY', l1: 'GREAT PEOPLE. GREAT', l2: 'PRODUCTS. GREAT SERVICE.', body: 'From an A/V services provider to a full entertainment business, built on long-term relationships and award-winning creative design. We also set up F&B venues end to end.', cta: 'CONTACT US', act: 'menu' }
];
var AH_GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      pct: 0, loaded: false, fading: false,
      p: 0, ch: 0, l1: AH_CH[0].l1, l2: AH_CH[0].l2, bodyOp: 1,
      sound: false, over: false, mx: -999, my: -999, menu: false
    };
    this.targetP = 0; this.curP = 0;
    this.mouse = { x: 0, y: 0, sx: 0, sy: 0 };
  }

  componentDidMount() {
    this.alive = true;
    var intro = this.props.showIntro ?? true;
    if (intro) {

    var POS = [[0, 2.3, 20], [0, 2.5, 10], [0, 2.85, 1.3], [0, 7.5, -12], [-1.5, 6.5, -26], [1, 17, -54], [-2, 17, -72], [0, 3.0, -96], [1, 4.8, -120], [0, 5.5, -134], [-5, 4.2, -158], [-14, 6, -182], [0, 34, -196], [8, 30, -208], [0, 26, -226], [0, 24, -244], [0, 25, -240]];

    POS[12] = [-3, gmax(-3, -198) + 4.5, -198]; TGT[12] = [0, heightAt(0, -224) + 0.5, -224];

    POS[14] = [-1, gmax(-1, -232) + 5.0, -232]; TGT[14] = [0, heightAt(0, -258) + 0.5, -258];

      T: T, renderer: renderer, scene: scene, camera: camera, rt: rt, postScene: postScene, postCam: postCam, postMat: postMat, PR: PR,
      canvas: canvas, cabs: cabs, small: small, nodeMesh: nodeMesh, speaker: speaker, refl: refl, terrainMat: terrainMat, skyMat: skyMat, sky: sky, water: water,
      reflRT: reflRT, reflCam: reflCam, texMat: texMat, clipPlane: clipPlane, revealMat: revealMat, halo: halo, halo2: halo2, waterMat: waterMat, ptsMats: ptsMats, ribbonMat: ribbonMat,
      posCurve: posCurve, tgtCurve: tgtCurve, toT: toT, rollAt: rollAt, leadAt: leadAt, sparkMat: sparkPts.material, upTmp: new T.Vector3(), dirTmp: new T.Vector3(), raycaster: new T.Raycaster(), ndc: new T.Vector2(), look: new T.Vector3(),
      colorTargets: [revealMat.uniforms.uColor.value, waterMat.uniforms.uColor.value, terrainMat.uniforms.uColor.value, skyMat.uniforms.uColor.value, postMat.uniforms.uFlashC.value, ribbonMat.uniforms.uColor.value, reflMat.color, halo.material.color, halo2.material.color, cityGlowMat.color, roadMat.color].concat(ptsMats.map(function (m) { return m.uniforms.uColor.value; })),
      scaledTargets: [[capMat.color, 1.25], [reflFront.color, 1.2], [cabSide.color, 1.2], [cabFront.color, 1.3], [smallMat.color, 1.1], [nodeMesh.material.color, 1.35]],

  }

  applyAccent(hex) {
    var g = this.gl; if (!g) return;
    var c = new g.T.Color(hex);
    g.colorTargets.forEach(function (t) { t.copy(c); });
    g.scaledTargets.forEach(function (t) { t[0].copy(c).multiplyScalar(t[1]); });
    g.hotTargets.forEach(function (t) { t.copy(c).lerp(new g.T.Color(1, 1, 1), 0.65); });
    this.accHex = hex;
  }

  renderGL(now) {
    var g = this.gl; if (!g) return;
    var w = g.canvas.clientWidth | 0, h = g.canvas.clientHeight | 0;
    if (w < 2 || h < 2) return;
    if (w !== g.w || h !== g.h) {
      g.w = w; g.h = h;
      g.renderer.setSize(w, h, false);
      g.rt.setSize(Math.floor(w * g.PR), Math.floor(h * g.PR));
      g.reflRT.setSize(Math.floor(w * g.PR * 0.6), Math.floor(h * g.PR * 0.6));
      g.postMat.uniforms.uRes.value.set(w * g.PR, h * g.PR);

    }
    var acc = this.props.accent ?? '#C2525E';
    if (acc !== this.accHex) this.applyAccent(acc);
    var t = (now - g.start) / 1000, p = this.curP;
    var m = this.mouse;
    m.sx += (m.x - m.sx) * 0.05; m.sy += (m.y - m.sy) * 0.05;
    function sst(a, b, x) { var k = Math.max(0, Math.min(1, (x - a) / (b - a))); return k * k * (3 - 2 * k); }

    g.tgtCurve.getPoint(tt, g.look);
    g.camera.position.x += m.sx * 0.9; g.camera.position.y += m.sy * 0.45;
    if (p > 0.66) { var gyMin = this.heightAt(g.camera.position.x, g.camera.position.z) + 2.4; if (g.camera.position.y < gyMin) g.camera.position.y = gyMin; }
    // when looking down at the ground, steer "up" by a roll angle so the light bundles sweep and turn across the screen
    var dir = g.dirTmp.copy(g.look).sub(g.camera.position).normalize();
    var downness = sst(0.55, 0.92, -dir.y), roll = g.rollAt(p) + m.sx * 0.06 * downness;
    g.upTmp.set(Math.sin(roll) * downness, 1 - downness, -Math.cos(roll) * downness).normalize();
    g.camera.up.copy(g.upTmp);
    g.ribbonMat.uniforms.uI.value = 1 - 0.55 * downness;
    var lead = g.leadAt(p); g.ribbonMat.uniforms.uLead.value = lead; g.terrainMat.uniforms.uLead.value = lead; g.sparkMat.uniforms.uLead.value = lead;

    var sp = g.speaker;
    var turn = Math.min(1, p / 0.16); turn = turn * turn * (3 - 2 * turn);

    sp.rotation.y = -0.38 * settle + turn * Math.PI * 2 + (m.sx * 0.3 + Math.sin(t * 0.25) * 0.06) * settle;
    sp.rotation.x = m.sy * 0.06 * settle;
    var vis = p < 0.178; sp.visible = vis; g.halo.visible = vis; g.halo2.visible = vis;
    g.cabs.visible = p > 0.3 && p < 0.74; g.small.visible = p > 0.3 && p < 0.8; g.nodeMesh.visible = p > 0.7;

    var amt = g.revealMat.uniforms.uAmt;
    if (vis && p < 0.17 && this.state.over) {
      g.ndc.set(m.x, m.y);

  tick() {
    if (!this.alive) return;

    var now = performance.now();
    this.curP += (this.targetP - this.curP) * 0.07;
    if (Math.abs(this.targetP - this.curP) < 0.00005) this.curP = this.targetP;
    try { this.renderGL(now); } catch (e) { this.gl = null; }

    var up = {};
    if (Math.abs(this.curP - this.state.p) > 0.0015) up.p = this.curP;
    var ch = 0; [0.195, 0.375, 0.545, 0.72, 0.915].forEach((th) => { if (this.curP >= th) ch++; });

  scramble(str, k) {
    var out = '';
    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      if (ch === ' ' || i / str.length < k) out += ch;
      else out += Math.random() < 0.4 ? ' ' : AH_GLYPHS[Math.floor(Math.random() * AH_GLYPHS.length)];

  }

  goTo(i) {
    this.setState({ menu: false });
    var de = document.documentElement;
    var max = Math.max(0, (de.scrollHeight || 0) - window.innerHeight);
    window.scrollTo({ top: max * [0, 0.21, 0.4, 0.56, 0.8, 1][i], behavior: 'smooth' });
  }

  toggleSound() {

  renderVals() {
    var textOp = this.state.tOp ?? 1, textLift = this.state.tLift ?? 0;
    var s = this.state;
    var intro = this.props.showIntro ?? true;
    var c = AH_CH[s.ch];
    var lit = Math.round(s.pct / 100 * 13);
    var squares = [];
    for (var i = 0; i < 13; i++) squares.push({ st: 'background: ' + (i < lit ? '#F4E4E6' : '#3A2328') });
    var rail = AH_CH.map((x, i) => ({
      label: x.k,
      st: 'color: ' + (i === s.ch ? '#F4E4E6' : '#5E4950'),
      dot: 'background: ' + (i === s.ch ? '#F4E4E6' : 'transparent'),

      tagOp: s.p < 0.15 ? 1 : 0,
      tagLift: s.p < 0.15 ? '0px' : '-8px',

      tagY: (s.my - 30) + 'px'
    };
  }
}
