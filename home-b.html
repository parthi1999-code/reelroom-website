<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audioheads — Home (option B)</title>
<meta name="description" content="Audioheads: live show production, A/V rental and integration, an authorised Pioneer DJ service centre and artist management in Bengaluru since 2008.">
<meta name="theme-color" content="#0B0709">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' fill='%230B0709'/%3E%3Crect x='2' y='2' width='18' height='18' fill='none' stroke='%23C2525E' stroke-width='2'/%3E%3Ccircle cx='11' cy='13' r='4.5' fill='%23C2525E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Tektur:wght@600;800&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0709}
a{color:#F4E4E6}a:hover{color:#FFFFFF}
.ah-chamfer-l{clip-path:polygon(12px 0,100% 0,100% 100%,0 100%,0 12px)}
.ah-chamfer-r{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.ah-chamfer-cta{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.ah-card{clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.ah-card-l{clip-path:polygon(22px 0,100% 0,100% 100%,0 100%,0 22px)}
.ah-btn{transition:background .25s,color .25s}
.ah-btn:hover{background:rgba(194,82,94,.35)!important}
.ah-rev{transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
@keyframes ah-bob{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(3px);opacity:1}}
.ah-bob{animation:ah-bob 1.4s ease-in-out infinite}
.ah-card-b{clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
.ah-link{transition:color .2s,gap .2s}
.ah-link:hover{color:#FFFFFF!important;gap:14px!important}
.ah-svc{transition:background .3s,border-color .3s,transform .3s}
.ah-svc:hover{background:rgba(52,22,30,.86)!important;border-color:rgba(230,170,178,.28)!important}
.ah-in{transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1),filter 1.1s ease}
@keyframes ah-marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ah-marq{animation:ah-marq 38s linear infinite}
@media (prefers-reduced-motion: reduce){.ah-marq{animation:none}.ah-rev,.ah-in{transition:none}}
@media (max-width: 860px){.ah-stats4{grid-template-columns:repeat(2,minmax(0,1fr))!important}.ah-shows{grid-template-columns:1fr!important}.ah-navlinks{display:none!important}.ah-split{grid-template-columns:1fr!important}.ah-divider{display:none!important}}
</style>
<script src="vendor/three.min.js"></script>
<script src="vendor/morphdom-umd.min.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc-tpl">
<div style="background: #0B0709; color: #F4E4E6; font-family: 'Schibsted Grotesk', system-ui, sans-serif; position: relative">

  <!-- loader -->
  <sc-if value="{{ showLoader }}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 80; background: #0B0709; display: flex; align-items: center; justify-content: center; transition: opacity .7s ease; opacity: {{ loaderOpacity }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: Tektur, sans-serif; font-weight: 800; font-size: 40px; letter-spacing: .22em">AUDIOHEADS</span>
        <span style="font: 700 10px/1.5 'JetBrains Mono', monospace; letter-spacing: .14em; color: #F4E4E6">100% LOADED<br>READY TO EXPLORE</span>
      </div>
    </div>
  </sc-if>

  <!-- ===== sticky stage: flowing light background + HUD ===== -->
  <div aria-hidden="true" style="position: sticky; top: 0; height: min(100vh, 1000px); margin-bottom: calc(-1 * min(100vh, 1000px)); z-index: 0; pointer-events: none; background: radial-gradient(ellipse 70% 60% at 50% 45%, #2A0F15 0%, #12080B 55%, #0B0709 90%)">
    <canvas id="hb-gl" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity .4s; opacity: {{ glOp }}"></canvas>
  </div>
  <div style="position: sticky; top: 0; height: min(100vh, 1000px); margin-bottom: calc(-1 * min(100vh, 1000px)); z-index: 5; pointer-events: none">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 180px; transition: opacity .3s; opacity: {{ maskOp }}; background: linear-gradient(#0B0709 0%, #0B0709 52%, rgba(11,7,9,0) 100%)"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; transition: opacity .3s; opacity: {{ maskOp }}; background: linear-gradient(rgba(11,7,9,0) 0%, #0B0709 62%)"></div>
    <div aria-hidden="true" style="position: absolute; inset: 28px; border: 1px solid rgba(230,170,178,.14); border-radius: 16px"></div>
    <header style="position: absolute; top: 44px; left: 56px; right: 52px; display: flex; align-items: center; justify-content: space-between; gap: 24px; pointer-events: auto">
      <a href="home-b.html" aria-label="Audioheads home" aria-current="page" style="text-decoration: none; display: flex; align-items: center; gap: 12px; min-height: 44px">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"></rect><circle cx="11" cy="13" r="4.5" fill="currentColor"></circle><rect x="9" y="4" width="4" height="3" fill="currentColor"></rect></svg>
        <span style="font-family: Tektur, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: .24em">AUDIOHEADS</span>
      </a>
      <div style="display: flex; align-items: center; gap: 22px">
        <nav aria-label="Main" class="ah-navlinks" style="display: flex; gap: 20px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: .1em">
          <a href="about.html" style="text-decoration: none; padding: 14px 0; color: #F4E4E6">ABOUT</a>
          <a href="projects.html" style="text-decoration: none; padding: 14px 0; color: #F4E4E6">PROJECTS</a>
          <a href="#hb-services" style="text-decoration: none; padding: 14px 0; color: #F4E4E6">SERVICES</a>
          <a href="contact.html" style="text-decoration: none; padding: 14px 0; color: #F4E4E6">CONTACT</a>
        </nav>
        <div style="display: flex">
          <a href="contact.html" class="ah-chamfer-l ah-btn" style="background: rgba(40,20,26,.85); color: #F4E4E6; text-decoration: none; padding: 0 20px; height: 44px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .12em; display: flex; align-items: center; gap: 8px">
            <svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg>
            BOOK A SERVICE
          </a>
          <a href="tel:+919686416156" class="ah-chamfer-r" style="background: #F4E4E6; color: #0B0709; text-decoration: none; padding: 0 22px; height: 44px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .14em; display: flex; align-items: center; gap: 8px">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 3h4l2 5-3 2a12 12 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"></path></svg>
            CALL US
          </a>
        </div>
      </div>
    </header>
    <div style="position: absolute; left: 28px; right: 28px; bottom: 28px; height: 52px; border-top: 1px solid rgba(230,170,178,.14); display: flex; pointer-events: auto">
      <sc-if value="{{ notEnd }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ toggleSound }}" aria-pressed="{{ soundPressed }}" style="width: 132px; flex: none; background: none; border: none; border-right: 1px solid rgba(230,170,178,.14); color: #F4E4E6; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; cursor: pointer">
          <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 4h3l4-3v10L4 8H1z" fill="currentColor"></path><path d="{{ soundIconPath }}" stroke="currentColor" stroke-width="1.4" fill="none"></path></svg>
          {{ soundLabel }}
        </button>
      </sc-if>
      <sc-if value="{{ isEnd }}" hint-placeholder-val="{{ false }}">
        <span style="width: 200px; flex: none; display: flex; align-items: center; padding-left: 28px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">AUDIOHEADS.IN</span>
      </sc-if>
      <div style="flex: 1; position: relative">
        <div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; background: rgba(194,82,94,.12); width: {{ progW }}"></div>
        <sc-if value="{{ showCue }}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">
            <svg class="ah-bob" width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="5" y="0" width="3" height="3" fill="currentColor"></rect><rect x="2.5" y="5" width="3" height="3" fill="currentColor"></rect></svg>
            SCROLL TO EXPLORE
          </div>
        </sc-if>
      </div>
      <sc-if value="{{ notEnd }}" hint-placeholder-val="{{ true }}">
        <a href="https://wa.me/919686416156" style="width: 160px; flex: none; border-left: 1px solid rgba(230,170,178,.14); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">
          CHAT WITH US
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5.2A8 8 0 1 1 21 12z"></path></svg>
        </a>
      </sc-if>
      <sc-if value="{{ isEnd }}" hint-placeholder-val="{{ false }}">
        <div style="flex: none; border-left: 1px solid rgba(230,170,178,.14); display: flex; align-items: center; gap: 8px; padding: 0 20px">
          <a href="https://www.facebook.com/Audioheads" aria-label="Audioheads on Facebook" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A8939A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"></path></svg></a>
          <a href="https://www.instagram.com/audioheadsofficial" aria-label="Audioheads on Instagram" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A8939A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor"></circle></svg></a>
        </div>
      </sc-if>
    </div>
  </div>

  <!-- ===== content ===== -->
  <main style="position: relative; z-index: 2">

    <!-- hero -->
    <section style="height: min(100vh, 1000px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; padding: 0 40px; box-sizing: border-box">
      <span class="ah-in" style="font: 700 11px/1.5 'JetBrains Mono', monospace; letter-spacing: .16em; {{ hin.a }}">ENGAGE · INSPIRE · ENTERTAIN</span>
      <h1 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: clamp(68px, 10.5vw, 176px); line-height: .86; text-transform: uppercase; text-shadow: 0 6px 60px rgba(11,7,9,.6)">
        <span class="ah-in" style="display: block; {{ hin.b }}">We bring live</span>
        <span class="ah-in" style="display: block; {{ hin.c }}">events to life</span>
      </h1>
      <p class="ah-in" style="margin: 0; max-width: 560px; font-size: 17px; line-height: 1.6; color: #D4C0C4; {{ hin.d }}">Full-service live event production, high-end A/V rental and integration, from first design to final load-out, in venues of any size.</p>
      <div class="ah-in" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; {{ hin.e }}">
        <a href="#hb-services" class="ah-chamfer-cta" style="background: #F4E4E6; color: #0B0709; text-decoration: none; padding: 0 26px; height: 48px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .14em; display: flex; align-items: center; gap: 10px"><svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg>EXPLORE OUR SERVICES</a>
        <a href="contact.html" class="ah-chamfer-cta ah-btn" style="text-decoration: none; background: rgba(50,22,30,.7); border: 1px solid rgba(230,170,178,.2); padding: 0 26px; height: 48px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .14em; display: flex; align-items: center; gap: 10px"><svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg>BOOK A SERVICE</a>
      </div>
    </section>

    <!-- statement -->
    <section id="hb-st" style="min-height: min(100vh, 1000px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; text-align: center; padding: 120px 40px; box-sizing: border-box">
      <span class="ah-rev" style="font: 700 11px/1.5 'JetBrains Mono', monospace; letter-spacing: .14em; color: #A8939A; {{ rv.st }}">■ SINCE 2008 · BENGALURU, INDIA</span>
      <h2 class="ah-rev" style="margin: 0; max-width: 1180px; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: clamp(44px, 6vw, 96px); line-height: .98; text-transform: uppercase; {{ rv.st2 }}">From the first design to the final load-out, we make every show sound and look its best.</h2>
      <p class="ah-rev" style="margin: 0; max-width: 580px; font-size: 16px; line-height: 1.7; color: #BBA5A9; {{ rv.st3 }}">Sound engineers, lighting designers, technicians and artist managers under one roof, for clubs, festivals, auditoriums and brand experiences.</p>
    </section>

    <!-- services -->
    <section id="hb-services" style="position: relative; max-width: 1480px; margin: 0 auto; padding: 120px 56px 180px; box-sizing: border-box">
      <div class="ah-divider" aria-hidden="true" style="position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(230,170,178,.12)"></div>
      <div class="ah-split" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 80px; align-items: center; padding-bottom: 110px; border-bottom: 1px solid rgba(230,170,178,.12)">
        <h2 class="ah-rev" style="margin: 0; padding-left: 8%; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: clamp(64px, 8vw, 140px); line-height: .88; text-transform: uppercase; {{ rv.svc }}">What<br>we do</h2>
        <p class="ah-rev" style="margin: 0; padding-right: 8%; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; line-height: 1.6; {{ rv.svc2 }}">Six ways we keep your show running: production, rental, sales and integration, acoustics, an authorised service centre and talent management.</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding-top: 80px">
        <div style="display: flex; flex-direction: column; gap: 48px; padding: 0 3%">
          <sc-for list="{{ svcL }}" as="v" hint-placeholder-count="3">
            <div style="display: flex; justify-content: flex-end">
              <article class="ah-rev ah-card-l ah-svc" style="width: min(420px, 100%); min-height: 300px; background: rgba(32,16,21,.78); backdrop-filter: blur(8px); border: 1px solid rgba(230,170,178,.1); padding: 24px 26px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; {{ v.st }}">
                <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .12em; color: #A8939A">■ {{ v.n }}</span>
                <div style="display: flex; flex-direction: column; gap: 14px; text-align: right; align-items: flex-end">
                  <span style="font-weight: 800; font-size: 26px; letter-spacing: .02em; text-transform: uppercase">{{ v.title }}</span>
                  <span style="font-size: 14px; line-height: 1.7; color: #BBA5A9">{{ v.body }}</span>
                  <a href="{{ v.href }}" class="ah-link" style="text-decoration: none; display: flex; align-items: center; gap: 8px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #F4E4E6; min-height: 32px">{{ v.cta }}<svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg></a>
                </div>
              </article>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; flex-direction: column; gap: 48px; padding: 170px 3% 0">
          <sc-for list="{{ svcR }}" as="v" hint-placeholder-count="3">
            <div style="display: flex; justify-content: flex-start">
              <article class="ah-rev ah-card ah-svc" style="width: min(420px, 100%); min-height: 300px; background: rgba(32,16,21,.78); backdrop-filter: blur(8px); border: 1px solid rgba(230,170,178,.1); padding: 24px 26px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; {{ v.st }}">
                <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .12em; color: #A8939A; text-align: right">■ {{ v.n }}</span>
                <div style="display: flex; flex-direction: column; gap: 14px">
                  <span style="font-weight: 800; font-size: 26px; letter-spacing: .02em; text-transform: uppercase">{{ v.title }}</span>
                  <span style="font-size: 14px; line-height: 1.7; color: #BBA5A9">{{ v.body }}</span>
                  <a href="{{ v.href }}" class="ah-link" style="text-decoration: none; display: flex; align-items: center; gap: 8px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #F4E4E6; min-height: 32px">{{ v.cta }}<svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg></a>
                </div>
              </article>
            </div>
          </sc-for>
        </div>
      </div>
    </section>

    <!-- numbers -->
    <section id="hb-stats" style="max-width: 1240px; margin: 0 auto; padding: 120px 40px 160px; box-sizing: border-box">
      <div class="ah-stats4" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid rgba(230,170,178,.14); border-bottom: 1px solid rgba(230,170,178,.14)">
        <sc-for list="{{ stats }}" as="c" hint-placeholder-count="4">
          <div class="ah-rev" style="padding: 34px 26px 38px; display: flex; flex-direction: column; gap: 26px; {{ c.st }}">
            <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #A8939A">■ {{ c.label }}</span>
            <span style="font: 400 clamp(56px, 6vw, 92px)/1 'JetBrains Mono', monospace; letter-spacing: -.04em">{{ c.num }}</span>
            <span style="font-size: 14px; line-height: 1.6; color: #BBA5A9">{{ c.body }}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <!-- selected shows -->
    <section id="hb-shows" style="max-width: 1240px; margin: 0 auto; padding: 120px 40px 170px; box-sizing: border-box; display: flex; flex-direction: column; gap: 48px">
      <div class="ah-rev" style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; {{ rv.shows }}">
        <h2 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: clamp(48px, 5.5vw, 88px); line-height: .9; text-transform: uppercase">Selected shows</h2>
        <a href="projects.html" class="ah-chamfer-cta ah-btn" style="text-decoration: none; background: rgba(50,22,30,.7); border: 1px solid rgba(230,170,178,.2); padding: 0 22px; height: 44px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; display: flex; align-items: center; gap: 10px"><svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg>OPEN THE PROJECT MAP</a>
      </div>
      <div class="ah-shows" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start">
        <sc-for list="{{ shows }}" as="w" hint-placeholder-count="3">
          <a href="projects.html" class="ah-card ah-rev ah-svc" style="text-decoration: none; color: #F4E4E6; background: rgba(32,16,21,.78); backdrop-filter: blur(8px); border: 1px solid rgba(230,170,178,.1); padding: 24px; min-height: 360px; display: flex; flex-direction: column; justify-content: space-between; gap: 30px; {{ w.st }}">
            <div style="display: flex; justify-content: space-between; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #A8939A"><span>■ {{ w.n }}</span><span>{{ w.city }}</span></div>
            <span style="font: 400 76px/1 'JetBrains Mono', monospace; letter-spacing: -.04em; color: {{ accent }}">{{ w.year }}</span>
