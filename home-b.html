<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audioheads — Home (option B)</title>
<meta name="description" content="Audioheads: live show production, A/V rental and integration, an authorised Pioneer DJ service centre and artist management in Bengaluru since 2008.">
<meta name="theme-color" content="#0B0709">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Crect width='22' height='22' fill='%230B0709'/%3E%3Crect x='2' y='2' width='18' height='18' fill='none' stroke='%23C2525E' stroke-width='2'/%3E%3Ccircle cx='11' cy='13' r='4.5' fill='%23C2525E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Tektur:wght@600;800&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0709}
a{color:#F4E4E6}a:hover{color:#FFFFFF}
.ah-chamfer-l{clip-path:polygon(12px 0,100% 0,100% 100%,0 100%,0 12px)}
.ah-chamfer-r{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.ah-chamfer-cta{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.ah-card{clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.ah-card-l{clip-path:polygon(22px 0,100% 0,100% 100%,0 100%,0 22px)}
.ah-btn{transition:background .25s,color .25s}
.ah-btn:hover{background:rgba(194,82,94,.35)!important}
.ah-rev{transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
@keyframes ah-bob{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(3px);opacity:1}}
.ah-bob{animation:ah-bob 1.4s ease-in-out infinite}
.ah-card-b{clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
.ah-link{transition:color .2s,gap .2s}
.ah-link:hover{color:#FFFFFF!important;gap:14px!important}
.ah-svc{transition:background .3s,border-color .3s,transform .3s}
.ah-svc:hover{background:rgba(52,22,30,.86)!important;border-color:rgba(230,170,178,.28)!important}
.ah-in{transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1),filter 1.1s ease}
@keyframes ah-marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ah-marq{animation:ah-marq 38s linear infinite}
@media (prefers-reduced-motion: reduce){.ah-marq{animation:none}.ah-rev,.ah-in{transition:none}}
.hb-idx{transition:background .2s}.hb-idx:hover,.hb-idx:focus-visible{background:rgba(194,82,94,.16)}
.hb-row{transition:background .25s}.hb-row:hover{background:rgba(194,82,94,.08)}
@keyframes hb-open{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}.hb-panel{animation:hb-open .35s ease-out both}
@media (max-width: 1000px){.hb-hero{grid-template-columns:1fr!important;padding:140px 22px 90px!important}#hb-services,#hb-stats,#hb-shows,#hb-cta,.hb-strip,#hb-centre .ah-rev{padding-left:22px!important;padding-right:22px!important}.hb-row{grid-template-columns:44px minmax(0,1fr) 44px!important;gap:14px!important}.hb-strip>div{border-left:none!important;padding-left:0!important}.hb-tag{display:none}.hb-bento>*{grid-column:span 4!important;grid-row:auto!important}.hb-tl{grid-template-columns:repeat(2,minmax(0,1fr))!important}.hb-strip,.hb-acts,.hb-foot{grid-template-columns:1fr!important}.hb-panel{grid-template-columns:1fr!important}}
@media (max-width: 600px){header{left:20px!important;right:20px!important;top:30px!important}header .ah-chamfer-l{display:none!important}}
@media (max-width: 860px){.ah-navlinks{display:none!important}.ah-split{grid-template-columns:1fr!important}.ah-divider{display:none!important}}
</style>
<script src="vendor/three.min.js"></script>
<script src="vendor/morphdom-umd.min.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc-tpl">
<div style="background: #0B0709; color: #F4E4E6; font-family: 'Schibsted Grotesk', system-ui, sans-serif; position: relative">

  <!-- loader -->
  <sc-if value="{{ showLoader }}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 80; background: #0B0709; display: flex; align-items: center; justify-content: center; transition: opacity .7s ease; opacity: {{ loaderOpacity }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: Tektur, sans-serif; font-weight: 800; font-size: 40px; letter-spacing: .22em">AUDIOHEADS</span>
        <span style="font: 700 10px/1.5 'JetBrains Mono', monospace; letter-spacing: .14em; color: #F4E4E6">100% LOADED<br>READY TO EXPLORE</span>
      </div>
    </div>
  </sc-if>

  <!-- ===== sticky stage: flowing light background + HUD ===== -->
  <div aria-hidden="true" style="position: sticky; top: 0; height: min(100vh, 1000px); margin-bottom: calc(-1 * min(100vh, 1000px)); z-index: 0; pointer-events: none; background: radial-gradient(ellipse 70% 60% at 50% 45%, #2A0F15 0%, #12080B 55%, #0B0709 90%)">
    <canvas id="hb-gl" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity .4s; opacity: {{ glOp }}"></canvas>
  </div>
  <div style="position: sticky; top: 0; height: min(100vh, 1000px); margin-bottom: calc(-1 * min(100vh, 1000px)); z-index: 5; pointer-events: none">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 180px; transition: opacity .3s; opacity: {{ maskOp }}; background: linear-gradient(#0B0709 0%, #0B0709 52%, rgba(11,7,9,0) 100%)"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; transition: opacity .3s; opacity: {{ maskOp }}; background: linear-gradient(rgba(11,7,9,0) 0%, #0B0709 62%)"></div>
    <div aria-hidden="true" style="position: absolute; inset: 28px; border: 1px solid rgba(230,170,178,.14); border-radius: 16px"></div>
    <header style="position: absolute; top: 44px; left: 56px; right: 52px; display: flex; align-items: center; justify-content: space-between; gap: 24px; pointer-events: auto">
      <a href="home-b.html" aria-label="Audioheads home" aria-current="page" style="text-decoration: none; display: flex; align-items: center; gap: 12px; min-height: 44px">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"></rect><circle cx="11" cy="13" r="4.5" fill="currentColor"></circle><rect x="9" y="4" width="4" height="3" fill="currentColor"></rect></svg>
        <span style="font-family: Tektur, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: .24em">AUDIOHEADS</span>
      </a>
      <div style="display: flex; align-items: center; gap: 22px">
        <nav aria-label="Main" class="ah-navlinks" style="display: flex; gap: 20px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: .1em">
          <a href="about.html" style="text-decoration: none; padding: 14px 0; color: #F4E4E6">ABOUT</a>
          <a href="projects.html" style="text-decoration: none; padding: 14px 0; color: #F4E4E6">PROJECTS</a>
          <a href="#hb-services" style="text-decoration: none; padding: 14px 0; color: #F4E4E6">SERVICES</a>
          <a href="contact.html" style="text-decoration: none; padding: 14px 0; color: #F4E4E6">CONTACT</a>
        </nav>
        <div style="display: flex">
          <a href="contact.html" class="ah-chamfer-l ah-btn" style="background: rgba(40,20,26,.85); color: #F4E4E6; text-decoration: none; padding: 0 20px; height: 44px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .12em; display: flex; align-items: center; gap: 8px">
            <svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg>
            BOOK A SERVICE
          </a>
          <a href="tel:+919686416156" class="ah-chamfer-r" style="background: #F4E4E6; color: #0B0709; text-decoration: none; padding: 0 22px; height: 44px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .14em; display: flex; align-items: center; gap: 8px">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 3h4l2 5-3 2a12 12 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"></path></svg>
            CALL US
          </a>
        </div>
      </div>
    </header>
    <div style="position: absolute; left: 28px; right: 28px; bottom: 28px; height: 52px; border-top: 1px solid rgba(230,170,178,.14); display: flex; pointer-events: auto">
      <sc-if value="{{ notEnd }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ toggleSound }}" aria-pressed="{{ soundPressed }}" style="width: 132px; flex: none; background: none; border: none; border-right: 1px solid rgba(230,170,178,.14); color: #F4E4E6; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; cursor: pointer">
          <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 4h3l4-3v10L4 8H1z" fill="currentColor"></path><path d="{{ soundIconPath }}" stroke="currentColor" stroke-width="1.4" fill="none"></path></svg>
          {{ soundLabel }}
        </button>
      </sc-if>
      <sc-if value="{{ isEnd }}" hint-placeholder-val="{{ false }}">
        <span style="width: 200px; flex: none; display: flex; align-items: center; padding-left: 28px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">AUDIOHEADS.IN</span>
      </sc-if>
      <div style="flex: 1; position: relative">
        <div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; background: rgba(194,82,94,.12); width: {{ progW }}"></div>
        <sc-if value="{{ showCue }}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">
            <svg class="ah-bob" width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="5" y="0" width="3" height="3" fill="currentColor"></rect><rect x="2.5" y="5" width="3" height="3" fill="currentColor"></rect></svg>
            SCROLL TO EXPLORE
          </div>
        </sc-if>
      </div>
      <sc-if value="{{ notEnd }}" hint-placeholder-val="{{ true }}">
        <a href="https://wa.me/919686416156" style="width: 160px; flex: none; border-left: 1px solid rgba(230,170,178,.14); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em">
          CHAT WITH US
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5.2A8 8 0 1 1 21 12z"></path></svg>
        </a>
      </sc-if>
      <sc-if value="{{ isEnd }}" hint-placeholder-val="{{ false }}">
        <div style="flex: none; border-left: 1px solid rgba(230,170,178,.14); display: flex; align-items: center; gap: 8px; padding: 0 20px">
          <a href="https://www.facebook.com/Audioheads" aria-label="Audioheads on Facebook" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A8939A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"></path></svg></a>
          <a href="https://www.instagram.com/audioheadsofficial" aria-label="Audioheads on Instagram" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A8939A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor"></circle></svg></a>
        </div>
      </sc-if>
    </div>
  </div>

  <!-- ===== content ===== -->
  <main style="position: relative; z-index: 2">

    <!-- hero: left-aligned editorial, with a service index -->
    <section style="min-height: min(100vh, 1000px); display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: 48px; align-items: end; padding: 150px 72px 130px; box-sizing: border-box" class="hb-hero">
      <div style="display: flex; flex-direction: column; gap: 26px">
        <span class="ah-in" style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; {{ hin.a }}">■ AUDIOHEADS · BENGALURU · SINCE 2008</span>
        <h1 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; text-transform: uppercase; font-size: clamp(72px, 9.2vw, 164px); line-height: .84; text-shadow: 0 6px 60px rgba(11,7,9,.6)">
          <span class="ah-in" style="display: block; {{ hin.b }}">We bring</span>
          <span class="ah-in" style="display: block; {{ hin.c }}">live events</span>
          <span class="ah-in" style="display: block; color: transparent; -webkit-text-stroke: 1.5px #F4E4E6; {{ hin.d }}">to life</span>
        </h1>
        <div class="ah-in" style="display: flex; align-items: flex-end; gap: 36px; flex-wrap: wrap; {{ hin.e }}">
          <p style="margin: 0; max-width: 420px; font-size: 16px; line-height: 1.65; color: #D4C0C4">Full-service live event production, high-end A/V rental and integration, from first design to final load-out.</p>
          <div style="display: flex; gap: 10px; flex-wrap: wrap">
            <a href="#hb-services" class="ah-chamfer-cta" style="background: #F4E4E6; color: #0B0709; text-decoration: none; padding: 0 24px; height: 48px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .14em; display: flex; align-items: center; gap: 10px"><svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg>OUR SERVICES</a>
            <a href="contact.html" class="ah-chamfer-cta ah-btn" style="text-decoration: none; background: rgba(50,22,30,.7); border: 1px solid rgba(230,170,178,.2); padding: 0 24px; height: 48px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .14em; display: flex; align-items: center; gap: 10px">BOOK A SERVICE</a>
          </div>
        </div>
      </div>
      <nav aria-label="Services index" class="ah-card ah-in" style="background: rgba(32,16,21,.78); backdrop-filter: blur(8px); border: 1px solid rgba(230,170,178,.1); padding: 22px 0 10px; {{ hin.f }}">
        <div style="display: flex; justify-content: space-between; padding: 0 22px 14px; font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #A8939A"><span>■ INDEX</span><span>06</span></div>
        <sc-for list="{{ index }}" as="x" hint-placeholder-count="6">
          <button type="button" onClick="{{ x.go }}" class="hb-idx" style="width: 100%; background: transparent; border: none; border-top: 1px solid rgba(230,170,178,.1); color: #F4E4E6; cursor: pointer; display: flex; align-items: center; gap: 16px; padding: 0 22px; min-height: 48px; text-align: left">
            <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #7A6268; width: 24px">{{ x.n }}</span>
            <span style="flex: 1; font-weight: 700; font-size: 15px">{{ x.title }}</span>
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 10L10 2M4 2h6v6" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg>
          </button>
        </sc-for>
      </nav>
    </section>

    <!-- brands band -->
    <section id="hb-brands" aria-label="Brands we work with" style="padding: 0 0 130px; overflow: hidden">
      <div class="ah-rev" style="border-top: 1px solid rgba(230,170,178,.12); border-bottom: 1px solid rgba(230,170,178,.12); background: rgba(11,7,9,.55); backdrop-filter: blur(6px); {{ rv.brands }}">
        <div style="display: flex; align-items: stretch">
          <span style="flex: none; display: flex; align-items: center; padding: 0 28px; border-right: 1px solid rgba(230,170,178,.12); font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #A8939A; background: #0B0709; position: relative; z-index: 1">BRANDS ■</span>
          <div style="overflow: hidden; flex: 1; padding: 22px 0">
            <div class="ah-marq" style="display: flex; width: max-content">
              <sc-for list="{{ brands }}" as="b" hint-placeholder-count="20">
                <span style="display: flex; align-items: center; gap: 34px; padding-right: 34px; white-space: nowrap; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; text-transform: uppercase; font-size: clamp(30px, 3vw, 46px); line-height: 1; {{ b.st }}">{{ b.name }}<span aria-hidden="true" style="width: 8px; height: 8px; background: {{ accent }}"></span></span>
              </sc-for>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- services: full-width expanding list -->
    <section id="hb-services" style="max-width: 1360px; margin: 0 auto; padding: 60px 56px 170px; box-sizing: border-box">
      <div class="ah-rev" style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; flex-wrap: wrap; padding-bottom: 46px; {{ rv.svc }}">
        <div style="display: flex; flex-direction: column; gap: 18px">
          <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #A8939A">■ SERVICES</span>
          <h2 style="margin: 0; max-width: 760px; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; text-transform: uppercase; font-size: clamp(48px, 5.2vw, 86px); line-height: .9">Six ways we keep your show running</h2>
        </div>
        <p style="margin: 0; max-width: 360px; font-size: 15px; line-height: 1.7; color: #BBA5A9">Open any service to see what’s included. Everything is run by our own crew out of Bengaluru.</p>
      </div>
      <div style="border-bottom: 1px solid rgba(230,170,178,.14)">
        <sc-for list="{{ svc }}" as="v" hint-placeholder-count="6">
          <div id="{{ v.id }}" class="ah-rev" style="border-top: 1px solid rgba(230,170,178,.14); {{ v.rowSt }}">
            <button type="button" onClick="{{ v.toggle }}" aria-expanded="{{ v.exp }}" aria-controls="{{ v.pid }}" class="hb-row" style="width: 100%; background: transparent; border: none; color: #F4E4E6; cursor: pointer; display: grid; grid-template-columns: 72px minmax(0, 1fr) auto 44px; align-items: center; gap: 24px; padding: 26px 8px; text-align: left">
              <span style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: {{ v.numC }}">{{ v.n }}</span>
              <span style="font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; text-transform: uppercase; font-size: clamp(34px, 4.2vw, 68px); line-height: .95; {{ v.titleSt }}">{{ v.title }}</span>
              <span class="hb-tag" style="font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #A8939A; white-space: nowrap">{{ v.tag }}</span>
              <span aria-hidden="true" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(230,170,178,.22); {{ v.iconSt }}">
                <svg width="12" height="12" viewBox="0 0 12 12"><path d="{{ v.icon }}" stroke="currentColor" stroke-width="1.6" fill="none"></path></svg>
              </span>
            </button>
            <sc-if value="{{ v.open }}" hint-placeholder-val="{{ false }}">
              <div id="{{ v.pid }}" class="hb-panel" style="display: grid; grid-template-columns: 72px minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; padding: 0 8px 34px">
                <span></span>
                <div style="display: flex; flex-direction: column; gap: 22px">
                  <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #E6D3D6; max-width: 560px">{{ v.body }}</p>
                  <a href="{{ v.href }}" class="ah-chamfer-cta" style="align-self: flex-start; background: #F4E4E6; color: #0B0709; text-decoration: none; padding: 0 24px; height: 48px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: .14em; display: flex; align-items: center; gap: 10px"><svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="0" y="6" width="3" height="3" fill="currentColor"></rect></svg>{{ v.cta }}</a>
                </div>
                <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
                  <sc-for list="{{ v.points }}" as="pt" hint-placeholder-count="3">
                    <li style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid rgba(230,170,178,.1); font: 700 10px 'JetBrains Mono', monospace; letter-spacing: .14em; color: #D4C0C4"><span style="width: 6px; height: 6px; background: {{ accent }}"></span>{{ pt }}</li>
                  </sc-for>
                </ul>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </section>

    <!-- numbers: bento grid -->
    <section id="hb-stats" style="max-width: 1360px; margin: 0 auto; padding: 40px 56px 170px; box-sizing: border-box">
      <div class="hb-bento" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(210px, auto); gap: 14px">
        <article class="ah-card ah-rev" style="grid-column: span 2; grid-row: span 2; background: rgba(32,16,21,.78); backdrop-filter: blur(8px); border: 1px solid rgba(230,170,178,.1); padding: 28px; display: flex; flex-direction: column; justify-content: space-between; {{ bento.a }}">

        for (var s = -1; s <= 1; s += 2) { pos.push(0, 0, 0); aU.push(k / N); aV.push(s); aP.push(b[0], b[1], b[2], b[3]); aQ.push(b[4], b[5], b[6], b[7]); aR.push(b[8], b[9]); }
        if (k > 0) { var o = base + (k - 1) * 2; idx.push(o, o + 1, o + 2, o + 1, o + 3, o + 2); }
      }
      base += (N + 1) * 2;
    });
    var g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setAttribute('aU0', new T.Float32BufferAttribute(aU, 1));
    g.setAttribute('aV', new T.Float32BufferAttribute(aV, 1));
    g.setAttribute('aP', new T.Float32BufferAttribute(aP, 4));
    g.setAttribute('aQ', new T.Float32BufferAttribute(aQ, 4));
    g.setAttribute('aR', new T.Float32BufferAttribute(aR, 2));
    g.setIndex(idx);
    var ribbonMat = new T.ShaderMaterial({
      transparent: true, depthWrite: false, depthTest: false, blending: T.AdditiveBlending, side: T.DoubleSide,
      uniforms: { uTime: { value: 0 }, uScroll: { value: 0 }, uColor: { value: acc.clone() }, uHot: { value: hot.clone() } },
      vertexShader: [
        'uniform float uTime; uniform float uScroll;',
        'attribute float aU0; attribute float aV; attribute vec4 aP; attribute vec4 aQ; attribute vec2 aR;',
        'varying float vU; varying float vN; varying float vV; varying float vS; varying float vB; varying float vD;',
        'void main(){',
        ' float u=aU0; float t=uTime*aQ.y; float W=110.0;',
        ' float a1=u*aP.y+aP.z+t; float a2=u*aP.y*2.3-aP.z*1.7-t*0.7;',
        ' float R=56.0; float yb=mod(aP.w+uScroll*aR.x+R*0.5,R)-R*0.5;',
        ' float y=yb+aP.x*sin(a1)+aP.x*0.45*sin(a2);',
        ' float dy=(aP.x*cos(a1)*aP.y+aP.x*0.45*cos(a2)*aP.y*2.3)/W;',
        ' vec2 n=normalize(vec2(-dy,1.0));',
        ' float x=(u-0.5)*W; float z=aR.y+5.0*sin(u*2.4+aP.z+t*0.5);',
        ' vec3 p=vec3(x+n.x*aV*aQ.x*0.5, y+n.y*aV*aQ.x*0.5, z);',
        ' vU=u*260.0; vN=u; vV=aV; vS=aQ.z; vB=aQ.w;',
        ' vec4 mv=modelViewMatrix*vec4(p,1.0); vD=-mv.z; gl_Position=projectionMatrix*mv; }'
      ].join('\n'),
      fragmentShader: [
        'uniform float uTime; uniform vec3 uColor; uniform vec3 uHot;',
        'varying float vU; varying float vN; varying float vV; varying float vS; varying float vB; varying float vD;',
        'float h1(float x){ return fract(sin(x*127.1)*43758.5453); }',
        'float h2(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }',
        'void main(){',
        ' float v=vV; float vi=v/0.42; float inner=1.0-smoothstep(0.85,1.05,abs(vi));',
        ' float N=12.0; float x=(vi*0.5+0.5)*N; float id=floor(x);',
        ' float wob=sin(vU*0.09+id*1.7+vS*6.0)*0.2+sin(vU*0.021+id*0.7)*0.3;',
        ' float f=fract(x+wob)-0.5; float sb=0.2+0.8*pow(h1(id+vS*31.0),1.6);',
        ' float line=(1.0-smoothstep(0.035,0.12,abs(f)))*sb*inner;',
        ' float core=exp(-vi*vi*6.0)*inner; float halo=exp(-v*v*4.0);',
        ' float ph=fract(vU*0.011-uTime*0.25*(0.7+vS)+h1(id+3.0)); float dash=exp(-ph*28.0)*line;',
        ' vec2 cell=floor(vec2(vU*2.4,x*2.0)); float dots=step(0.972,h2(cell+vS*13.0))*inner*(0.55+0.45*sin(uTime*3.0+cell.x*1.3));',
        ' float ends=smoothstep(0.0,0.05,vN)*smoothstep(1.0,0.95,vN); float fade=exp(-vD*0.0062)*(0.35+0.65*smoothstep(2.0,10.0,vD));',
        ' float I=(line*1.0+core*0.6+halo*0.18+dash*2.4+dots*1.6)*vB*ends*fade;',
        ' vec3 col=mix(uColor,uHot,clamp(core*0.6+dash*0.7+dots*0.6+line*0.15,0.0,1.0));',
        ' gl_FragColor=vec4(col*I,1.0); }'
      ].join('\n')
    });
    var rib = new T.Mesh(g, ribbonMat); rib.frustumCulled = false; scene.add(rib);
    // dust
    var dn = 900, dp = new Float32Array(dn * 3), ds = new Float32Array(dn);
    for (var i = 0; i < dn; i++) { dp[i * 3] = (Math.random() - 0.5) * 120; dp[i * 3 + 1] = (Math.random() - 0.5) * 60; dp[i * 3 + 2] = -Math.random() * 30; ds[i] = Math.random(); }
    var dg = new T.BufferGeometry(); dg.setAttribute('position', new T.BufferAttribute(dp, 3)); dg.setAttribute('aSeed', new T.BufferAttribute(ds, 1));
    var dustMat = new T.ShaderMaterial({
      transparent: true, depthWrite: false, blending: T.AdditiveBlending,
      uniforms: { uTime: { value: 0 }, uColor: { value: acc.clone() }, uPR: { value: PR } },
      vertexShader: 'uniform float uTime; uniform float uPR; attribute float aSeed; varying float vA; void main(){ vec3 p=position; p.y+=mod(uTime*0.4*(0.3+aSeed)+aSeed*60.0,60.0)-30.0; vec4 mv=modelViewMatrix*vec4(p,1.0); vA=0.4+0.6*sin(uTime*2.0+aSeed*30.0); gl_PointSize=(1.5+aSeed*2.5)*uPR; gl_Position=projectionMatrix*mv; }',
      fragmentShader: 'uniform vec3 uColor; varying float vA; void main(){ float d=length(gl_PointCoord-0.5); float a=smoothstep(0.5,0.0,d)*max(vA,0.0)*0.7; gl_FragColor=vec4(mix(uColor,vec3(1.0),0.5)*a,a); }'
    });
    scene.add(new T.Points(dg, dustMat));
    this.gl = { T: T, renderer: renderer, scene: scene, camera: camera, canvas: canvas, ribbonMat: ribbonMat, dustMat: dustMat, w: 0, h: 0, start: performance.now() };
  }
  tick() {
    if (!this.alive) return;
    this.raf = requestAnimationFrame(() => this.tick());
    var g = this.gl; if (!g) return;
    try {
      var w = g.canvas.clientWidth | 0, h = g.canvas.clientHeight | 0; if (w < 2 || h < 2) return;
      if (w !== g.w || h !== g.h) { g.w = w; g.h = h; g.renderer.setSize(w, h, false); g.camera.aspect = w / h; g.camera.updateProjectionMatrix(); }
      var acc = this.props.accent ?? '#C2525E';
      if (acc !== this.accHex) { var c = new g.T.Color(acc); g.ribbonMat.uniforms.uColor.value.copy(c); g.ribbonMat.uniforms.uHot.value.copy(c).lerp(new g.T.Color(1, 1, 1), 0.65); g.dustMat.uniforms.uColor.value.copy(c); this.accHex = acc; }
      var t = (performance.now() - g.start) / 1000;
      this.ssy += (this.sy - this.ssy) * 0.08;
      var vh = window.innerHeight || 900;
      var m = this.mouse; m.sx += (m.x - m.sx) * 0.04; m.sy += (m.y - m.sy) * 0.04;
      g.ribbonMat.uniforms.uTime.value = t; g.ribbonMat.uniforms.uScroll.value = this.ssy / vh;
      g.dustMat.uniforms.uTime.value = t;
      g.camera.position.x = m.sx * 2.5; g.camera.position.y = m.sy * 1.5;
      g.camera.rotation.z = Math.sin(this.ssy / vh * 0.6) * 0.12;
      g.camera.lookAt(0, 0, 0);
      g.renderer.render(g.scene, g.camera);
    } catch (e) { this.gl = null; }
  }
  toggleSound() {
    try {
      if (!this.ac) {
        var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        var ac = new AC(); this.ac = ac;
        var master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination); this.master = master;
        var filter = ac.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 420; filter.Q.value = 0.8; filter.connect(master); this.filter = filter;
        [[55, 'sine', 0.55, 0], [82.41, 'sawtooth', 0.12, 6], [110, 'triangle', 0.22, -5], [164.81, 'sine', 0.08, 3]].forEach(function (o) {
          var osc = ac.createOscillator(); osc.type = o[1]; osc.frequency.value = o[0]; osc.detune.value = o[3];
          var gg = ac.createGain(); gg.gain.value = o[2]; osc.connect(gg); gg.connect(filter); osc.start();
        });
        var lfo = ac.createOscillator(); lfo.frequency.value = 0.08; var lg = ac.createGain(); lg.gain.value = 160; lfo.connect(lg); lg.connect(filter.frequency); lfo.start();
      }
      var on = !this.state.sound;
      if (on) { this.ac.resume(); this.master.gain.setTargetAtTime(0.09, this.ac.currentTime, 0.8); }
      else { this.master.gain.setTargetAtTime(0, this.ac.currentTime, 0.25); }
      this.setState({ sound: on });
    } catch (e) {}
  }


  goSvc(i) {
    this.setState({ openSvc: i });
    try { var el = document.getElementById('hb-svc-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
  }
  renderVals() {
    var s = this.state, v = s.vis, acc = this.props.accent ?? '#C2525E';
    var rev = (on, d) => 'opacity: ' + (on ? 1 : 0) + '; transform: translateY(' + (on ? 0 : 40) + 'px); transition-delay: ' + (d || 0) + 'ms';
    var hin = (d) => 'opacity: ' + (s.heroIn ? 1 : 0) + '; transform: translateY(' + (s.heroIn ? 0 : 28) + 'px); filter: blur(' + (s.heroIn ? 0 : 8) + 'px); transition-delay: ' + d + 'ms';
    var brands = HB_BRANDS.concat(HB_BRANDS).map((n, i) => ({ name: n, st: i % 2 ? 'color: transparent; -webkit-text-stroke: 1px rgba(244,228,230,.55)' : 'color: #F4E4E6' }));
    var svc = HB_SVC.map((x, i) => {
      var open = s.openSvc === i;
      return {
        id: 'hb-svc-' + i, pid: 'hb-svc-p' + i, open: open, exp: open ? 'true' : 'false',
        rowSt: rev(v['hb-services'], 150 + i * 90) + '; scroll-margin-top: 110px',
        toggle: () => this.setState({ openSvc: this.state.openSvc === i ? -1 : i }),
        numC: open ? acc : '#7A6268',
        titleSt: open ? 'color: #F4E4E6' : 'color: transparent; -webkit-text-stroke: 1px rgba(244,228,230,.7)',
        iconSt: open ? 'background: ' + acc + '; border-color: ' + acc + '; color: #0B0709' : 'color: #F4E4E6',
        icon: open ? 'M2 6h8' : 'M6 2v8M2 6h8',
        n: x.n, title: x.title, tag: x.tag, body: x.body, href: x.href, cta: x.cta, points: x.points
      };
    });
    var c = s.counts, done = c[1] === 15;
    return {
      accent: acc,
      showLoader: !s.loaded, loaderOpacity: s.fading ? 0 : 1,
      maskOp: s.scrolled ? 1 : 0,
      hin: { a: hin(0), b: hin(120), c: hin(240), d: hin(380), e: hin(540), f: hin(680) },
      index: HB_SVC.map((x, i) => ({ n: x.n, title: x.title, go: () => this.goSvc(i) })),
      brands,
      rv: {
        brands: rev(v['hb-brands'], 0),
        svc: rev(v['hb-services'], 0),
        shows: rev(v['hb-shows'], 0),
        centre: rev(v['hb-centre'], 0), centre2: rev(v['hb-centre'], 220),
        cta: rev(v['hb-cta'], 0)
      },
      svc,
      bento: { a: rev(v['hb-stats'], 0), b: rev(v['hb-stats'], 120), c: rev(v['hb-stats'], 240), d: rev(v['hb-stats'], 360), e: rev(v['hb-stats'], 480) },
      num: {
        cap: String(c[1] || 0).padStart(2, '0') + (done ? 'K' : ''),
        since: String(c[0] || 1990),
        brands: String(c[2] || 0).padStart(2, '0'),
        cities: String(c[3] || 0).padStart(2, '0')
      },
      cities: HB_CITIES,
      lineW: v['hb-shows'] ? '100%' : '0%',
      timeline: HB_TIMELINE.map((t, i) => ({
        st: rev(v['hb-shows'], 250 + i * 220), year: t.year, city: t.city, name: t.name, body: t.body,
        yearSt: t.year === 'TODAY' ? 'color: ' + acc : 'color: #F4E4E6'
      })),
      actions: HB_ACTIONS.map((a, i) => Object.assign({}, a, { st: rev(v['hb-cta'], 150 + i * 120) })),
      glOp: s.p < 0.05 ? 1 : Math.max(0.62, 1 - (s.p - 0.05) * 6),
      progW: (s.p * 100).toFixed(2) + '%',
      showCue: s.p < 0.03, isEnd: s.endZone, notEnd: !s.endZone,
      soundLabel: s.sound ? 'SOUND ON' : 'SOUND OFF', soundPressed: s.sound ? 'true' : 'false',
      soundIconPath: s.sound ? 'M11 3.5c1.2 1 1.2 4 0 5M13 1.5c2.3 2 2.3 7 0 9' : 'M11 4l4 4M15 4l-4 4',
      toggleSound: () => this.toggleSound()
    };
  }
}
